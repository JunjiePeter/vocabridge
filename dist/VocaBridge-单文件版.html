      var body = document.getElementById('spBody');
      if (SP.tab === 'roleplay') renderRole(body);
      else if (SP.tab === 'shadow') renderShadow(body);
      else if (SP.tab === 'video') renderVideo(body);
      else renderFree(body);
    }
  };
  App.speakSession = SP;

  /* ---------------- 事件 ---------------- */
  ui.on('sp-tab', function (a) {
    SP.tab = a.val;
    if (SP.rec.active) stopRec();
    App.views.speaking.render(document.getElementById('view'));
  });

  ui.on('sp-start', function (a) {
    var sec = parseInt(a.val || '60', 10);
    startRec(sec, function (text, meta) {
      if (SP.tab === 'roleplay') roleAnswer(text, meta);
      else if (SP.tab === 'shadow') shadowResult(text, meta);
      else if (SP.tab === 'video') videoResult(text, meta);
      else freeResult(text, meta);
    });
  });

  ui.on('sp-stop', function () { stopRec(); });

  ui.on('sp-textSubmit', function () {
    var ta = document.getElementById('textAnswer');
    var text = ta ? ta.value.trim() : '';
    var meta = { durationMs: Math.max(15000, text.split(/\s+/).length / 130 * 60000), segments: [] };
    if (!text) return U.toast('先输入你的英文回答');
    if (SP.tab === 'roleplay') roleAnswer(text, meta);
    else if (SP.tab === 'shadow') shadowResult(text, meta);
    else if (SP.tab === 'video') videoResult(text, meta);
    else freeResult(text, meta);
  });

  ui.on('sp-roleOpen', function (a) { openRole(a.id); });
  ui.on('sp-roleExit', function () { SP.role = null; App.views.speaking.render(document.getElementById('view')); });
  ui.on('sp-roleRestart', function () { if (SP.role) openRole(SP.role.sc.id); });

  function openRole(id) {
    var sc = root.App.SCENARIOS.filter(function (x) { return x.id === id; })[0];
    if (!sc) return;
    SP.role = { sc: sc, idx: 0, log: [{ who: 'ai', text: sc.intro }], done: false, results: [] };
    if (S.state.settings.autoSpeak) tts.speak(sc.intro, { accent: sc.accent });
    App.views.speaking.render(document.getElementById('view'));
  }

  ui.on('sp-skip', function () {
    var r = SP.role; if (!r) return;
    r.log.push({ who: 'ai', text: 'No problem — let’s move on.' });
    if (r.idx >= r.sc.nodes.length - 1) { finishRole(); return; }
    r.idx++; App.views.speaking.render(document.getElementById('view'));
  });

  ui.on('sp-shadowOpen', function (a) { SP.shadow.mode = 'run'; SP.shadow.pid = a.id; SP.shadow.idx = 0; SP.shadow.res = null; SP.shadow.whole = false; App.views.speaking.render(document.getElementById('view')); });
  ui.on('sp-shadowExit', function () { SP.shadow.mode = 'list'; SP.shadow.res = null; SP.shadow.whole = false; App.views.speaking.render(document.getElementById('view')); });
  ui.on('sp-shadowRestart', function () { SP.shadow.idx = 0; SP.shadow.res = null; App.views.speaking.render(document.getElementById('view')); });
  ui.on('sp-shadowNext', function () { SP.shadow.idx++; SP.shadow.res = null; App.views.speaking.render(document.getElementById('view')); });
  ui.on('sp-slow', function (a) { tts.speak(a.el.getAttribute('data-id'), { rate: 0.7 }); });
  ui.on('sp-slow2', function (a) { tts.speak(a.el.getAttribute('data-id'), { rate: 0.5 }); });
  ui.on('sp-shadowWhole', function (a) { SP.shadow.whole = true; SP.shadow.res = null; App.views.speaking.render(document.getElementById('view')); });

  /* 视频跟读事件 */
  ui.on('video-open', function (a) { SP.video.mode = 'run'; SP.video.vid = a.id; SP.video.idx = 0; SP.video.res = null; App.views.speaking.render(document.getElementById('view')); });
  ui.on('video-back', function () { SP.video.mode = 'list'; SP.video.res = null; App.views.speaking.render(document.getElementById('view')); });
  ui.on('video-sel', function (a) { SP.video.idx = parseInt(a.id, 10) || 0; SP.video.res = null; App.views.speaking.render(document.getElementById('view')); });
  ui.on('video-next', function () { SP.video.idx++; SP.video.res = null; App.views.speaking.render(document.getElementById('view')); });
  ui.on('video-playSeg', function (a) {
    var v = findVideo(SP.video.vid); if (!v || !v.url) return;
    var s = v.sentences[parseInt(a.id, 10)];
    var player = document.getElementById('vPlayer');
    if (!player) return;
    if (s.start != null) player.currentTime = s.start;
    player.play();
    if (s.end != null) {
      var stopAt = s.end;
      var onT = function () { if (player.currentTime >= stopAt) { player.pause(); player.removeEventListener('timeupdate', onT); } };
      player.addEventListener('timeupdate', onT);
    }
  });
  ui.on('video-add', function () {
    var name = (document.getElementById('vName') || {}).value || '';
    var url = (document.getElementById('vUrl') || {}).value || '';
    var txt = (document.getElementById('vText') || {}).value || '';
    if (!name.trim() || !txt.trim()) return U.toast('名称和台词不能为空');
    var sentences = txt.split('\n').map(function (line) {
      line = line.trim(); if (!line) return null;
      var m = line.match(/^(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)\s*\|\s*(.+)$/);
      if (m) return { start: parseFloat(m[1]), end: parseFloat(m[2]), text: m[3].trim() };
      return { text: line };
    }).filter(Boolean);
    if (!sentences.length) return U.toast('台词格式不正确');
    var type = /\.mp4(\?|$)/i.test(url) ? 'mp4' : (/youtube|bilibili|player\./i.test(url) ? 'embed' : (url ? 'mp4' : 'mp4'));
    var v = {
      id: 'c' + U.uid(), title: name.trim(), source: '自定义视频', custom: true,
      type: type, url: type === 'embed' ? '' : url.trim(), embedUrl: type === 'embed' ? url.trim() : '',
      sentences: sentences
    };
    S.state.customVideos = S.state.customVideos || [];
    S.state.customVideos.push(v); S.save();
    U.toast('已添加：' + v.title);
    App.views.speaking.render(document.getElementById('view'));
  });

  ui.on('sp-freeOpen', function (a) { SP.free.mode = 'run'; SP.free.cue = CUES[parseInt(a.id, 10)]; SP.free.res = null; App.views.speaking.render(document.getElementById('view')); });
  ui.on('sp-freeRandom', function () { ui.fire('sp-freeOpen', { getAttribute: function () { return String(Math.floor(Math.random() * CUES.length)); } }); });
  ui.on('sp-freeExit', function () { SP.free.mode = 'list'; SP.free.res = null; App.views.speaking.render(document.getElementById('view')); });

  ui.on('sp-deep', function () {
    var res = SP.free.res || SP.shadow.res || (SP.role && SP.role.done ? null : null);
    var text = (SP.free.res && SP.free.res.text) || (SP.shadow.res && SP.shadow.res.text) ||
      (SP.role && SP.role.results ? SP.role.results.map(function (r) { return r.text; }).join(' ') : '');
    if (!text) return U.toast('先完成一次口语练习');
    var box = document.getElementById('deepBox');
    if (box) box.innerHTML = '<div class="loading">AI 深度点评中…</div>';
    App.eval.deep({
      text: text,
      task: SP.tab === 'roleplay' ? (SP.role ? SP.role.sc.title : '') : (SP.tab === 'free' && SP.free.cue ? SP.free.cue.t : 'shadow reading'),
      scenario: SP.tab
    }).then(function (d) {
      if (box) {
        box.innerHTML = '<div class="corr"><b>✨ GPT 精批</b>' +
          (d.verdict ? '<p>' + U.esc(d.verdict) + '</p>' : '') +
          '<div class="row mini"><span class="badge">F ' + d.fluency + '</span><span class="badge">V ' + d.vocabulary + '</span><span class="badge">G ' + d.grammar + '</span><span class="badge">P ' + d.pronunciation + '</span><span class="badge ok">Overall ' + d.overall + '</span></div>' +
          (d.corrections || []).map(function (c) {
            return '<div class="corr-item"><div class="row"><code class="no">“' + U.esc(c.original) + '”</code> → <code class="yes">' + U.esc(c.suggestion) + '</code></div><p class="muted">' + U.esc(c.reason) + '</p></div>';
          }).join('') +
          (d.polishedVersion ? '<div class="polished"><b>润色后的版本</b><p>' + U.esc(d.polishedVersion) + '</p>' + ui.speakBtn(d.polishedVersion) + '</div>' : '') +
          '</div>';
      }
    }).catch(function (e) {
      if (box) box.innerHTML = '<div class="corr"><b>调用失败</b><p class="muted">' + U.esc(String(e.message || e)) + '。检查 Base URL / Key / 模型名，或暂时使用本地评分引擎。</p></div>';
    });
  });

  App.CUES = CUES;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== js/views-exam.js ===== */
/* ===========================================================
 * 英语能力测评（参考英语流利说测评方案）
 * 五个部分：词汇 20 / 语法 20 / 听力 20 / 阅读 20 / 口语 20 → 总分 100
 * 输出：总分 + CEFR 等级 + 雅思参考分 + 五维雷达图 + 针对性学习路径 + 历史对比
 * =========================================================== */
(function (root) {
  'use strict';
  var App = root.App, U = App.util, S = App.store, ui = App.ui;
  var tts = App.tts, asr = App.asr;

  var EX = { stage: 'intro', sections: [], si: 0, qi: 0, answers: {}, shadow: [], cue: null, rec: { active: false, timer: null, startedAt: 0, cb: null } };
  var SECS = [
    { key: 'vocab', label: '词汇', icon: '📖' },
    { key: 'grammar', label: '语法', icon: '✍️' },
    { key: 'listening', label: '听力', icon: '👂' },
    { key: 'reading', label: '阅读', icon: '📄' },
    { key: 'speaking', label: '口语', icon: '🎙️' }
  ];

  /* ---------------- 题目生成 ---------------- */
  function buildQuestions() {
    var ielts = App.vocab.all('ielts');
    var tiers = [ielts.slice(0, 60), ielts.slice(60, 120), ielts.slice(120)];
    var vocabQ = [];
    [3, 4, 3].forEach(function (n, t) {
      U.sample(tiers[t], n).forEach(function (w) {
        var others = U.sample(ielts.filter(function (x) { return x.id !== w.id; }), 3);
        var opts = U.shuffle([w.cn].concat(others.map(function (x) { return x.cn; })));
        vocabQ.push({ prompt: w.word, sub: w.phon, options: opts, answer: w.cn });
      });
    });

    var grammarQ = [];
    var topics = App.GRAMMAR;
    for (var i = 0; i < topics.length && grammarQ.length < 8; i += Math.max(1, Math.floor(topics.length / 8))) {
      var t = topics[i];
      var q = U.pick(t.quiz.filter(function (x) { return x.type === 'choice'; }));
      if (q) grammarQ.push({ prompt: q.q, options: q.options, answer: q.options[q.a], ex: q.ex, topic: t.title });
    }

    var shadowPool = [];
    App.PASSAGES.forEach(function (p) { p.sentences.forEach(function (s) { shadowPool.push({ ref: s, pid: p.id }); }); });
    var shadow = U.sample(shadowPool.filter(function (x) { return x.ref.split(/\s+/).length >= 8; }), 3);

    return {
      vocab: vocabQ,
      grammar: grammarQ.slice(0, 8),
      listening: App.EXAM_LISTENING,
      reading: App.EXAM_READING,
      shadow: shadow,
      cue: U.pick(App.CUES)
    };
  }

  /* ---------------- 分数与等级 ---------------- */
  function scoreToLevel(score) {
    if (score < 25) return { cefr: 'A1', ielts: '4.0', desc: '基础入门：能处理最简单的日常用语' };
    if (score < 40) return { cefr: 'A2', ielts: '5.0', desc: '初级：能完成熟悉的日常交流' };
    if (score < 55) return { cefr: 'B1', ielts: '5.5', desc: '中级：能独立处理多数日常与工作场景' };
    if (score < 70) return { cefr: 'B2', ielts: '6.5', desc: '中高级：能流畅就专业领域交流，距 7.0 一步之遥' };
    if (score < 85) return { cefr: 'C1', ielts: '7.0-7.5', desc: '高级：能自如应对学术与职场英语，符合海外招聘主流门槛' };
    return { cefr: 'C2', ielts: '8.0+', desc: '接近母语：可以放心冲 8 分或高阶面试' };
  }

  function recommend(parts) {
    var map = {
      vocab: { label: '词汇', tip: '每天 20 词新学 + 复习；先把「雅思核心」背完再攻「求职职场」。', link: '#/vocab' },
      grammar: { label: '语法', tip: '重点补「现在完成时 / 条件句 / 中式英语纠偏」三讲。', link: '#/grammar' },
      listening: { label: '听力', tip: '每天影子跟读 2 篇，先 0.7x 再常速。', link: '#/speaking' },
      reading: { label: '阅读', tip: '跟读素材自带长难句，读完做一遍全文复述。', link: '#/speaking' },
      speaking: { label: '口语', tip: '先把 6 个情景模拟全过一遍，再练自由陈述。', link: '#/speaking' }
    };
    return Object.keys(map).filter(function (k) { return parts[k] < 65; })
      .sort(function (a, b) { return parts[a] - parts[b]; }).map(function (k) { return map[k]; });
  }

  /* ---------------- 录音 ---------------- */
  function recStart(sec, cb) {
    if (EX.rec.active) return;
    EX.rec.active = true; EX.rec.startedAt = Date.now(); EX.rec.cb = cb;
    EX.rec.timer = setInterval(function () {
      var el = document.getElementById('exRecStatus');
      if (el) el.textContent = '● 录音中 ' + Math.round((Date.now() - EX.rec.startedAt) / 1000) + 's';
      if (Date.now() - EX.rec.startedAt >= sec * 1000) recStop();
    }, 250);
    App.views.exam.render(document.getElementById('view'));
    if (asr.supported()) {
      asr.start({
        lang: 'en-US',
        onPartial: function (full) {
          var p = document.getElementById('exRecPartial');
          if (p) p.textContent = full;
        },
        onEnd: function (finalText) { EX.rec._final = finalText; },
        onError: function () { EX.textMode = true; }
      });
    } else { EX.textMode = true; }
  }

  function recStop() {
    if (!EX.rec.active) return;
    EX.rec.active = false;
    clearInterval(EX.rec.timer);
    var cb = EX.rec.cb; EX.rec.cb = null;
    var dur = Date.now() - EX.rec.startedAt;
    if (EX.textMode) {
      var ta = document.getElementById('exTextAnswer');
      cb((ta ? ta.value : '').trim(), dur);
    } else {
      asr.stop();
      setTimeout(function () { cb((EX.rec._final || '').trim(), dur); }, 400);
    }
  }

  /* ---------------- 渲染 ---------------- */
  function renderIntro(el) {
    var last = (S.state.exams || []).slice(-1)[0];
    var hist = (S.state.exams || []).slice(-4).reverse();
    el.innerHTML =
      ui.card('<b>英语能力测评</b>' +
        '<p class="muted">参考流利说测评方案，五个部分各 20 分：词汇 → 语法 → 听力 → 阅读 → 口语。约 12-15 分钟，结束后给出 CEFR 等级、雅思参考分和针对性学习路径。</p>' +
        '<div class="sec-row">' + SECS.map(function (s) {
          return '<span class="chip static">' + s.icon + ' ' + s.label + '</span>';
        }).join('') + '</div>' +
        '<div class="row center-row">' + ui.btn('开始测评', 'exam-start', { cls: 'primary' }) + '</div>' +
        '<p class="muted mini center">建议戴耳机、保持安静，口语环节需允许麦克风权限。</p>') +
      (last ? ui.card('<b>历史测评</b>' +
        hist.map(function (e) {
          var lv = scoreToLevel(e.overall);
          return '<div class="row spread mini"><span class="muted">' + e.date + '</span>' +
            '<span><b>' + e.overall + '</b> 分 · ' + lv.cefr + '（雅思约 ' + lv.ielts + '）</span></div>';
        }).join('')) : '') +
      ui.card('<p class="muted mini">评分仅供参考：词/法/听/读为客观题判分；口语由本地 AI 引擎（流利度/词汇/语法/发音）换算。想更准，可在设置中接入大模型。</p>');
  }

  function sectionLen(key) {
    var qs = EX.sections;
    if (!qs) return 1;
    if (key === 'vocab') return qs.vocab.length;
    if (key === 'grammar') return qs.grammar.length;
    if (key === 'listening') return qs.listening.length;
    if (key === 'reading') return qs.reading.questions.length;
    return qs.shadow.length + 1;
  }

  function renderSection(el) {
    var sec = SECS[EX.si], qs = EX.sections, key = sec.key;
    var len = sectionLen(key);
    var head = '<div class="row spread"><span class="tag">' + sec.icon + ' ' + sec.label + ' ' + (EX.qi + 1) + '/' + len + '</span>' +
      '<span class="muted mini">第 ' + (EX.si + 1) + ' 部分 / 共 ' + SECS.length + ' 部分</span></div>' +
      ui.bar((EX.si * 100 + EX.qi / len * 100) / SECS.length);

    if (key === 'reading') {
      var r = qs.reading, q = r.questions[EX.qi];
      el.innerHTML = head +
        ui.card('<b>' + U.esc(r.title) + '</b><div class="passage">' + U.esc(r.passage).split('\n\n').map(function (p) { return '<p>' + p + '</p>'; }).join('') +
          '<button class="spk" data-act="speak" data-id="' + U.esc(r.passage.replace(/\n+/g, ' ')) + '">🔊 朗读全文</button></div>') +
        choiceCard(q, 'exam-reading');
      return;
    }

    if (key === 'listening') {
      var l = qs.listening[EX.qi];
      el.innerHTML = head +
        ui.card('<div class="center" style="margin:6px 0"><div class="q-tip">👂 听句子，选出正确理解</div>' +
          '<div class="row center-row">' + ui.btn('▶ 播放', 'exam-listenPlay', { id: l.id, cls: 'primary' }) +
          ui.btn('🐢 慢速', 'exam-listenSlow', { id: l.id }) + '</div>' +
          (EX.showListenText ? '<div class="ex-box"><div class="ex">' + U.esc(l.text) + '</div><div class="ex-cn">' + U.esc(l.cn) + '</div></div>' : '') +
          '</div>') +
        choiceCard({ prompt: l.q, options: l.options, answer: l.options[l.a] }, 'exam-listening');
      if (!EX._played || EX._played !== l.id) { EX._played = l.id; setTimeout(function () { tts.speak(l.text, { rate: 0.95 }); }, 300); }
      return;
    }

    if (key === 'speaking') { renderSpeaking(el, head); return; }

    // vocab / grammar
    var list = key === 'vocab' ? qs.vocab : qs.grammar;
    el.innerHTML = head + choiceCard(list[EX.qi], 'exam-answer');
  }

  function choiceCard(q, act) {
    return ui.card(
      '<div class="prompt">' + U.esc(q.prompt) + '</div>' +
      (q.sub ? '<div class="muted mini">' + U.esc(q.sub) + '</div>' : '') +
      (q.topic ? '<div class="muted mini">考点：' + U.esc(q.topic) + '</div>' : '') +
      '<div class="opts">' + q.options.map(function (o) {
        return '<button class="opt" data-act="' + act + '" data-id="' + U.esc(o) + '">' + U.esc(o) + '</button>';
      }).join('') + '</div>');
  }

  function renderSpeaking(el, head) {
    var qs = EX.sections;
    var total = qs.shadow.length + 1;
    if (EX.qi < qs.shadow.length) {
      var s = qs.shadow[EX.qi];
      el.innerHTML = head +
        ui.card('<div class="q-tip"><b>跟读第 ' + (EX.qi + 1) + ' / ' + qs.shadow.length + ' 句</b></div>' +
          '<div class="shadow-sent">' + U.esc(s.ref) + '</div>' +
          '<div class="row center-row">' + ui.btn('▶ 常速', 'speak', { id: s.ref, cls: 'primary' }) +
          ui.btn('🐢 0.7x', 'sp-slow', { id: s.ref }) + '</div>' +
          (EX.rec.active
            ? '<div class="card rec-box"><div id="exRecStatus" class="rec-status">● 录音中…</div><div id="exRecPartial" class="rec-partial muted"></div>' + ui.btn('■ 停止', 'exam-recStop', { cls: 'danger block' }) + '</div>'
            : EX.textMode
              ? '<textarea id="exTextAnswer" class="input area" placeholder="Repeat the sentence here…"></textarea>' +
              '<div class="row center-row">' + ui.btn('提交', 'exam-textSubmit', { cls: 'primary' }) + '</div>'
              : '<div class="row center-row">' + ui.btn('🎤 跟读', 'exam-recStart', { cls: 'primary mic-lg', val: '25' }) + '</div>') +
          (EX.shadowLast != null ? '<p class="muted center">上一句匹配度：<b>' + Math.round(EX.shadowLast * 100) + '%</b></p>' : ''));
      return;
    }
    // 自由口语
    var c = qs.cue;
    el.innerHTML = head +
      ui.card('<div class="q-tip"><b>自由口述（45 秒）</b></div>' +
        '<div class="shadow-sent">' + U.esc(c.t) + '</div>' +
        '<ul class="cue-bul">' + c.b.map(function (b) { return '<li>' + U.esc(b) + '</li>'; }).join('') + '</ul>' +
        (EX.rec.active
          ? '<div class="card rec-box"><div id="exRecStatus" class="rec-status">● 录音中…</div><div id="exRecPartial" class="rec-partial muted"></div>' + ui.btn('■ 停止', 'exam-recStop', { cls: 'danger block' }) + '</div>'
          : EX.textMode
            ? '<textarea id="exTextAnswer" class="input area" placeholder="Speak or type your answer…"></textarea>' +
            '<div class="row center-row">' + ui.btn('提交', 'exam-textSubmit', { cls: 'primary' }) + '</div>'
            : '<div class="row center-row">' + ui.btn('🎤 开始口述', 'exam-recStart', { cls: 'primary mic-lg', val: '45' }) + '</div>'));
  }

  function radar(parts) {
    var keys = ['vocab', 'grammar', 'listening', 'reading', 'speaking'];
    var labels = { vocab: '词汇', grammar: '语法', listening: '听力', reading: '阅读', speaking: '口语' };
    var cx = 130, cy = 110, R = 80, n = keys.length;
    function pt(i, r) {
      var ang = -Math.PI / 2 + i * 2 * Math.PI / n;
      return [cx + Math.cos(ang) * r, cy + Math.sin(ang) * r];
    }
    var rings = [0.25, 0.5, 0.75, 1].map(function (f) {
      return '<polygon points="' + keys.map(function (_, i) { return pt(i, R * f).join(','); }).join(' ') + '" fill="none" stroke="#e7e9f2"/>';
    }).join('');
    var axes = keys.map(function (_, i) {
      var p = pt(i, R); return '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0] + '" y2="' + p[1] + '" stroke="#e7e9f2"/>';
    }).join('');
    var poly = keys.map(function (k, i) { return pt(i, R * U.clamp(parts[k], 0, 100) / 100).join(','); }).join(' ');
    var labs = keys.map(function (k, i) {
      var p = pt(i, R + 16);
      return '<text x="' + p[0] + '" y="' + p[1] + '" text-anchor="middle" font-size="11" fill="#3b4058">' + labels[k] + '</text>';
    }).join('');
    return '<svg viewBox="0 0 260 230" class="radar">' + rings + axes +
      '<polygon points="' + poly + '" fill="rgba(79,70,229,.25)" stroke="#4f46e5" stroke-width="2"/>' + labs + '</svg>';
  }

  function renderResult(el) {
    var p = EX.parts;
    var overall = Math.round((p.vocab + p.grammar + p.listening + p.reading + p.speaking) / 5);
    var lv = scoreToLevel(overall);
    var prev = (S.state.exams || []).slice(-1)[0];
    var delta = prev ? overall - prev.overall : null;
    var recs = recommend(p);

    // 保存历史
    (S.state.exams = S.state.exams || []).push({ date: U.today(), overall: overall, parts: p, cefr: lv.cefr });
    if (S.state.exams.length > 12) S.state.exams.shift();
    S.save();

    el.innerHTML =
      ui.card('<div class="center"><div class="done-ico">🏅</div>' +
        '<h3>测评总分 ' + overall + ' / 100</h3>' +
        '<div class="row center-row">' +
        '<span class="tag">' + lv.cefr + '</span>' +
        '<span class="tag">雅思约 ' + lv.ielts + '</span>' +
        (delta != null ? '<span class="tag ' + (delta >= 0 ? 'ok' : '') + '">较上次 ' + (delta >= 0 ? '+' : '') + delta + '</span>' : '') +
        '</div>' +
        '<p class="muted">' + lv.desc + '</p></div>') +
      ui.card('<b>五维雷达</b>' + radar(p) +
        '<div class="stat-row">' + ['vocab', 'grammar', 'listening', 'reading', 'speaking'].map(function (k) {
          var name = { vocab: '词汇', grammar: '语法', listening: '听力', reading: '阅读', speaking: '口语' }[k];
          return '<div><b>' + Math.round(p[k]) + '</b><span>' + name + '</span></div>';
        }).join('') + '</div>') +
      (EX.speakReport ? ui.card('<b>口语细评</b><div class="mini muted">' +
        '跟读匹配度 ' + Math.round(EX.shadowAvg * 100) + '%　自由口述 Band ' + EX.speakReport.scores.overall +
        '</div>' + (EX.speakReport.errors.length ? '<div class="corr">' + EX.speakReport.errors.slice(0, 5).map(function (c) {
          return '<div class="corr-item"><div class="row"><code class="no">“' + U.esc(c.original) + '”</code> → <code class="yes">' + U.esc(c.suggestion) + '</code></div></div>';
        }).join('') + '</div>' : '')) : '') +
      ui.card('<b>下一步怎么练</b>' +
        (recs.length ? recs.map(function (r) {
          return '<div class="mode-item"><div><b>' + r.label + '（' + Math.round(p[{ vocab: 'vocab', grammar: 'grammar', listening: 'listening', reading: 'reading', speaking: 'speaking' }[r.label] || 'vocab'] || 0) + '）</b><p class="muted">' + r.tip + '</p></div>' +
            ui.btn('去练习', 'go', { val: r.link, cls: 'primary sm' }) + '</div>';
        }).join('') : '<p class="muted">五维全部 ≥ 65，状态很好，直接进入「情景模拟」刷面试话术。</p>')) +
      '<div class="row center-row">' + ui.btn('再测一次', 'exam-start', {}) + ui.btn('回到今日', 'go', { val: '#/today', cls: 'primary' }) + '</div>';
  }

  App.views = App.views || {};
  App.views.exam = {
    title: '测评', icon: '🏅',
    render: function (el) {
      if (EX.stage === 'run') renderSection(el);
      else if (EX.stage === 'result') renderResult(el);
      else renderIntro(el);
    }
  };

  function advance() {
    var sec = SECS[EX.si], len = sectionLen(sec.key);
    EX.qi++; EX.showListenText = false;
    if (EX.qi >= len) { EX.si++; EX.qi = 0; }
    if (EX.si >= SECS.length) { finish(); return; }
    App.views.exam.render(document.getElementById('view'));
  }

  function finish() {
    var qs = EX.sections, a = EX.answers;
    var parts = {
      vocab: a.vocab.filter(Boolean).length / qs.vocab.length * 100,
      grammar: a.grammar.filter(Boolean).length / qs.grammar.length * 100,
      listening: a.listening.filter(Boolean).length / qs.listening.length * 100,
      reading: a.reading.filter(Boolean).length / qs.reading.questions.length * 100,
      speaking: Math.round(EX.shadowAvg * 100 * 0.5 + EX.freeScore * 0.5)
    };
    EX.parts = parts;
    EX.stage = 'result';
    App.views.exam.render(document.getElementById('view'));
  }

  ui.on('exam-start', function () {
    EX.stage = 'run'; EX.si = 0; EX.qi = 0; EX.shadowLast = null;
    EX.sections = buildQuestions();
    EX.answers = { vocab: [], grammar: [], listening: [], reading: [] };
    EX.textMode = !asr.supported();
    App.views.exam.render(document.getElementById('view'));
  });

  function markAnswer(kind, chosen, q) {
    var ok = chosen === q.answer;
    EX.answers[kind].push(ok);
    if (ok) S.bump('quiz'); else S.bump('review');
    U.toast(ok ? '✓ 正确' : '✗ 正确答案：' + q.answer);
    setTimeout(advance, 500);
  }

  ui.on('exam-answer', function (a) {
    var sec = SECS[EX.si].key;
    var q = (sec === 'vocab' ? EX.sections.vocab : EX.sections.grammar)[EX.qi];
    markAnswer(sec, a.el.getAttribute('data-id'), q);
  });
  ui.on('exam-reading', function (a) {
    var q = EX.sections.reading.questions[EX.qi];
    var q2 = { answer: q.options[q.a] };
    markAnswer('reading', a.el.getAttribute('data-id'), q2);
  });
  ui.on('exam-listening', function (a) {
    var l = EX.sections.listening[EX.qi];
    EX.showListenText = true;
    markAnswer('listening', a.el.getAttribute('data-id'), { answer: l.options[l.a] });
    App.views.exam.render(document.getElementById('view'));
  });
  ui.on('exam-listenPlay', function (a) { var l = EX.sections.listening.filter(function (x) { return x.id === a.id; })[0]; tts.speak(l.text, {}); });
  ui.on('exam-listenSlow', function (a) { var l = EX.sections.listening.filter(function (x) { return x.id === a.id; })[0]; tts.speak(l.text, { rate: 0.65 }); });

  ui.on('exam-recStart', function (a) {
    recStart(parseInt(a.val || '30', 10), function (text, dur) {
      var qs = EX.sections;
      if (EX.qi < qs.shadow.length) {
        var res = App.eval.analyze({ text: text, reference: qs.shadow[EX.qi].ref, durationMs: dur });
        EX.shadowAcc = EX.shadowAcc || [];
        var acc = res.pronunciation ? res.pronunciation.accuracy : 0;
        EX.shadowAcc.push(acc);
        EX.shadowLast = acc;
        U.toast('匹配度 ' + Math.round(acc * 100) + '%');
        advance();
      } else {
        var res2 = App.eval.analyze({ text: text, durationMs: dur });
        EX.freeScore = res2.scores.overall / 9 * 100;
        EX.speakReport = res2;
        advance();
      }
    });
  });
  ui.on('exam-recStop', function () { recStop(); });
  ui.on('exam-textSubmit', function () {
    var ta = document.getElementById('exTextAnswer');
    var text = ta ? ta.value.trim() : '';
    var dur = Math.max(10000, text.split(/\s+/).length / 130 * 60000);
    var qs = EX.sections;
    if (EX.qi < qs.shadow.length) {
      var res = App.eval.analyze({ text: text, reference: qs.shadow[EX.qi].ref, durationMs: dur });
      var acc = res.pronunciation ? res.pronunciation.accuracy : 0;
      (EX.shadowAcc = EX.shadowAcc || []).push(acc);
      EX.shadowLast = acc; advance();
    } else {
      var res2 = App.eval.analyze({ text: text, durationMs: dur });
      EX.freeScore = res2.scores.overall / 9 * 100;
      EX.speakReport = res2; advance();
    }
  });

  // 每次进入口语部分初始化
  var _origRender = App.views.exam.render;
  App.views.exam.render = function (el) {
    if (EX.stage === 'run' && SECS[EX.si] && SECS[EX.si].key === 'speaking' && !EX._speakInit) {
      EX._speakInit = true; EX.shadowAcc = [];
    }
    if (EX.stage === 'run' && SECS[EX.si] && SECS[EX.si].key !== 'speaking') EX._speakInit = false;
    _origRender(el);
  };
  // 口语进入 finish 前计算均分
  var _origFinish = finish;
  finish = function () {
    var acc = (EX.shadowAcc && EX.shadowAcc.length) ? EX.shadowAcc.reduce(function (a, b) { return a + b; }, 0) / EX.shadowAcc.length : 0;
    EX.shadowAvg = acc;
    if (EX.freeScore == null) EX.freeScore = 0;
    _origFinish();
  };

  App.examSession = EX;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== js/views-review.js ===== */
/* ===========================================================
 * 今日 / 复习队列 / 学习报告 / 设置
 * =========================================================== */
(function (root) {
  'use strict';
  var App = root.App, U = App.util, S = App.store, srs = App.srs, ui = App.ui;

  /* ---------------- 今日 ---------------- */
  function todayCtx() {
    var deck = S.state.settings.deck;
    var due = srs.dueWords(deck === 'all' ? null : deck);
    var newW = App.vocab.all(deck).filter(function (w) { return !S.state.words[w.id]; });
    var gw = S.state.wrongbook.filter(function (x) { return x.kind === 'grammar'; });
    var spw = S.state.wrongbook.filter(function (x) { return x.kind === 'speak'; });
    var wbW = S.state.wrongbook.filter(function (x) { return x.kind === 'word'; });
    return { due: due, newW: newW, gw: gw, spw: spw, wbW: wbW };
  }

  App.views = App.views || {};
  App.views.today = {
    title: '今日', icon: '🏠',
    render: function (el) {
      var c = todayCtx(), st = S.state;
      var day = S.day();
      var goal = st.settings.dailyGoal || 40;
      var doneScore = day.learn + day.review + day.quiz * 2;
      var hour = new Date().getHours();
      var hi = hour < 6 ? '夜深了' : hour < 11 ? '早上好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : '晚上好';
      var sessions = st.sessions.slice(-5).reverse();

      el.innerHTML =
        ui.card('<div class="hero">' +
          '<div class="hero-txt"><b>' + hi + (st.profile.name ? '，' + U.esc(st.profile.name) : '') + '</b>' +
          '<span class="muted">目标：雅思 + 海外求职　|　连续打卡 ' + S.streak() + ' 天</span></div>' +
          ui.ring(doneScore / goal * 100, doneScore + '/' + goal, '今日进度') +
          '</div>' +
          '<div class="stat-row">' +
          '<div><b>' + day.learn + '</b><span>新学</span></div>' +
          '<div><b>' + day.review + '</b><span>复习</span></div>' +
          '<div><b>' + day.speak + '</b><span>口语练习</span></div>' +
          '<div><b>' + U.round1(day.minutes) + '</b><span>分钟</span></div>' +
          '</div>') +
        ui.card('<b>今天该做什么</b>' +
          '<div class="task-grid">' +
          '<div class="task"><span class="t-ico">🆕</span><b>学新词</b><i>' + c.newW.length + ' 词未学</i>' + ui.btn('开始', 'vocab-start', { val: 'learn', cls: 'primary sm' }) + '</div>' +
          '<div class="task"><span class="t-ico">🔁</span><b>到期复习</b><i>' + c.due.length + ' 词</i>' + ui.btn('开始', 'vocab-start', { val: 'review', cls: 'primary sm' }) + '</div>' +
          '<div class="task"><span class="t-ico">🎙️</span><b>情景口语</b><i>6 个真实场景</i>' + ui.btn('去练习', 'go', { val: '#/speaking', cls: 'primary sm' }) + '</div>' +
          '<div class="task"><span class="t-ico">🎧</span><b>影子跟读</b><i>' + root.App.PASSAGES.length + ' 篇素材</i>' + ui.btn('去跟读', 'goShadow', { cls: 'primary sm' }) + '</div>' +
          '<div class="task"><span class="t-ico">🏅</span><b>能力测评</b><i>' + ((S.state.exams || []).length ? '已测 ' + (S.state.exams.length) + ' 次' : '尚未测评') + '</i>' + ui.btn('去测评', 'go', { val: '#/exam', cls: 'primary sm' }) + '</div>' +
          '<div class="task"><span class="t-ico">✍️</span><b>语法</b><i>' + c.gw.length + ' 道错题</i>' + ui.btn('去练习', 'go', { val: '#/grammar', cls: 'primary sm' }) + '</div>' +
          '<div class="task"><span class="t-ico">📕</span><b>错词本</b><i>' + c.wbW.length + ' 词</i>' + ui.btn('查看', 'go', { val: '#/review', cls: 'primary sm' }) + '</div>' +
          '</div>') +
        '<div class="grid2">' +
        (sessions.length ? ui.card('<b>最近口语成绩</b>' + sessions.map(function (s) {
          return '<div class="row spread mini"><span class="muted">' + U.esc(s.title.slice(0, 22)) + '</span>' +
            '<b class="' + (s.overall >= 7 ? 'ok-c' : s.overall >= 6 ? '' : 'bad-c') + '">' + s.overall + '</b></div>';
        }).join('')) : '') +
        ui.card('<b>雅思口语评分参照</b>' +
          '<div class="ref"><span><b>9</b> 接近母语</span><span><b>7</b> 能流利表达、偶有误用</span>' +
          '<span><b>6</b> 能持续讲话、结构有限</span><span><b>5</b> 需重复、停顿多</span></div>' +
          '<p class="muted mini">AI 老师按 Fluency / Vocabulary / Grammar / Pronunciation 四项分别给分，总分为四项均值。</p>') +
        '</div>';
    }
  };

  /* ---------------- 复习 ---------------- */
  App.views.review = {
    title: '复习', icon: '🔁',
    render: function (el) {
      var c = todayCtx();
      el.innerHTML =
        ui.card('<div class="row spread"><div><b>待复习单词</b><br><span class="muted">按遗忘曲线到期 ' + c.due.length + ' 个</span></div>' +
          (c.due.length ? ui.btn('开始复习', 'vocab-start', { val: 'review', cls: 'primary' }) : '<span class="tag ok">今日清空 ✓</span>') + '</div>') +
        (c.wbW.length ? ui.card('<div class="row spread"><div><b>错词本</b><br><span class="muted">' + c.wbW.length + ' 词</span></div>' +
          ui.btn('专项练习', 'vocab-startWrong', { cls: 'primary' }) + '</div>' +
          '<div class="wrong-list">' + c.wbW.slice(0, 12).map(function (x) {
            var w = App.vocab.byId(x.id);
            return w ? '<span class="chip static" data-act="vocab-detail" data-id="' + w.id + '">' + U.esc(w.word) + ' <i>' + U.esc(w.cn) + '</i><em>×' + x.count + '</em></span>' : '';
          }).join('') + '</div>') : '') +
        (c.gw.length ? ui.card('<div class="row spread"><div><b>语法错题</b><br><span class="muted">' + c.gw.length + ' 题</span></div>' +
          ui.btn('重做错题', 'grammar-practiceWrong', { cls: 'primary' }) + '</div>' +
          '<div class="wrong-list">' + c.gw.slice(0, 8).map(function (x) {
            return '<span class="chip static">' + U.esc((x.note || '').slice(0, 28)) + '<em>×' + x.count + '</em></span>';
          }).join('') + '</div>') : '') +
        (c.spw.length ? ui.card('<div class="row spread"><div><b>口语待纠句式</b><br><span class="muted">' + c.spw.length + ' 句，匹配度低于 70%</span></div>' + '</div>' +
          '<div class="wrong-list">' + c.spw.slice(0, 10).map(function (x) {
            return '<span class="chip static drill" data-act="review-drill" data-id="' + U.esc(x.id) + '">' + U.esc((x.note || '').slice(0, 40)) + '…' +
              '<em>重练</em></span>';
          }).join('') + '</div>') : '') +
        ui.card('<b>间隔重复机制</b><p class="muted">SM-2 算法：认识 → 间隔 1→3→7→21 天递增；答错 → 立即重排并降低难度系数。这保证你每天只复习「刚好要忘」的那部分内容。</p>');
    }
  };

  ui.on('review-drill', function (a) {
    var entry = S.state.wrongbook.filter(function (x) { return x.id === a.el.getAttribute('data-id'); })[0];
    if (!entry) return;
    var sentence = entry.note || '';
    var id = 'rp:' + entry.id;
    var exist = root.App.PASSAGES.filter(function (p) { return p.id === id; })[0];
    if (!exist) {
      exist = {
        id: id, title: '弱句重练', source: '来自你的口语错句本', accent: 'en-US', level: '练习',
        intro: '逐句重练直到匹配度 ≥ 90%', sentences: [sentence], vocab: []
      };
      root.App.PASSAGES.unshift(exist);
    }
    App.speakSession.tab = 'shadow';
    App.speakSession.shadow = { mode: 'run', pid: id, idx: 0, res: null, whole: false };
    App.speakSession.free.res = null;
    App.router.go('#/speaking');
    if (S.state.settings.autoSpeak) App.tts.speak(sentence, {});
  });

  ui.on('go', function (a) { App.router.go(a.val); });
  ui.on('goShadow', function () {
    App.speakSession.tab = 'shadow';
    App.speakSession.shadow = { mode: 'list', pid: null, idx: 0, res: null, whole: false };
    App.router.go('#/speaking');
  });

  /* ---------------- 报告 ---------------- */
  App.views.stats = {
    title: '报告', icon: '📊',
    render: function (el) {
      var st = S.state, days = [], i, k;
      for (i = 6; i >= 0; i--) days.push(U.addDays(U.today(), -i));
      var maxV = 1;
      var rows = days.map(function (d) {
        var v = st.days[d] || { learn: 0, review: 0, speak: 0, quiz: 0 };
        var tot = v.learn + v.review + v.quiz || 0;
        maxV = Math.max(maxV, tot, v.speak * 5);
        return { d: d, v: v, tot: tot };
      });

      var sessions = st.sessions.slice(-20);
      var chart = '';
      if (sessions.length >= 2) {
        var pts = sessions.map(function (s, idx) {
          var x = 10 + idx * (620 / Math.max(1, sessions.length - 1));
          var y = 90 - (s.overall / 9) * 80;
          return x.toFixed(1) + ',' + y.toFixed(1);
        }).join(' ');
        chart = '<svg class="line" viewBox="0 0 640 100" preserveAspectRatio="none">' +
          '<line x1="10" y1="10" x2="630" y2="10" class="grid-l"/>' +
          '<line x1="10" y1="90" x2="630" y2="90" class="grid-l"/>' +
          '<polyline points="' + pts + '" fill="none" stroke="#4f46e5" stroke-width="2.5"/>' +
          sessions.map(function (s, idx) {
            var x = 10 + idx * (620 / Math.max(1, sessions.length - 1));
            var y = 90 - (s.overall / 9) * 80;
            return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.5" fill="#4f46e5"/>';
          }).join('') + '</svg>' +
          '<div class="row spread muted mini"><span>' + sessions[0].date.slice(5) + '</span><span>9.0</span><span>' + sessions[sessions.length - 1].date.slice(5) + '</span></div>';
      }

      var vst = App.vocab.stats('all');
      var avgAll = sessions.length ? U.round1(sessions.reduce(function (a, s) { return a + s.overall; }, 0) / sessions.length) : 0;
      var topWrong = st.wrongbook.slice().sort(function (a, b) { return b.count - a.count; }).slice(0, 8);

      el.innerHTML =
        ui.card('<b>近 7 天学习量</b><div class="bars">' + rows.map(function (r) {
          return '<div class="bar-col"><i style="height:' + (r.tot / maxV * 100) + '%" title="词/题 ' + r.tot + '"></i>' +
            '<i class="s" style="height:' + (r.v.speak * 5 / maxV * 100) + '%" title="口语 ' + r.v.speak + ' 次"></i>' +
            '<span>' + r.d.slice(8) + '</span></div>';
        }).join('') + '</div>' +
          '<div class="row mini muted"><span class="legend"></span>蓝＝单词/语法练习次数　绿＝口语练习次数（×5 显示）</div>') +
        '<div class="grid2">' +
        ui.card('<b>词库掌握度</b>' +
          '<div class="dim-row"><span>已背词</span>' + ui.bar(vst.seen / vst.total * 100) + '<b>' + vst.seen + '/' + vst.total + '</b></div>' +
          '<div class="dim-row"><span>已长期记忆</span>' + ui.bar(vst.mastered / vst.total * 100) + '<b>' + vst.mastered + '</b></div>' +
          '<p class="muted mini">掌握标准：连续复习到 21 天以上间隔。</p>') +
        ui.card('<b>口语总览</b>' +
          '<div class="stat-row"><div><b>' + sessions.length + '</b><span>练习次数</span></div>' +
          '<div><b>' + avgAll + '</b><span>平均分</span></div>' +
          '<div><b>' + st.wrongbook.filter(function (x) { return x.kind === 'speak'; }).length + '</b><span>待纠句</span></div></div>' +
          (chart || '<p class="muted">完成 2 次以上口语练习后显示趋势图。</p>')) +
        '</div>' +
        (topWrong.length ? ui.card('<b>高频失分点</b><div class="wrong-list">' + topWrong.map(function (x) {
          var w = App.vocab.byId(x.id);
          return '<span class="chip static">' + (w ? U.esc(w.word) + ' <i>' + U.esc(w.cn) + '</i>' : U.esc((x.note || x.id).slice(0, 24))) + '<em>×' + x.count + '</em></span>';
        }).join('') + '</div>') : '') +
        (sessions.length ? ui.card('<b>练习记录</b><div class="rec-list">' + sessions.slice().reverse().slice(0, 10).map(function (s) {
          return '<div class="row spread mini"><span class="muted">' + s.date.slice(5) + ' · ' + U.esc(s.title.slice(0, 26)) + '</span>' +
            '<b>' + s.overall + '</b></div>';
        }).join('') + '</div>') : '');
    }
  };

  /* ---------------- 设置 ---------------- */
  App.views.settings = {
    title: '设置', icon: '⚙️',
    render: function (el) {
      var st = S.state.settings, llm = st.llm;
      el.innerHTML =
        ui.card('<b>学习计划</b>' +
          '<div class="form-row"><label>每日目标（词/题）</label><input class="input" type="number" min="10" max="200" value="' + st.dailyGoal + '" data-change="set-goal"></div>' +
          '<div class="form-row"><label>称呼</label><input class="input" value="' + U.esc(S.state.profile.name || '') + '" placeholder="比如 David / 小王" data-change="set-name"></div>') +
        ui.card('<b>语音设置</b>' +
          '<div class="form-row"><label>发音口音</label><select class="input" data-change="set-accent">' +
          '<option value="en-US"' + (st.accent === 'en-US' ? ' selected' : '') + '>美式 en-US</option>' +
          '<option value="en-GB"' + (st.accent === 'en-GB' ? ' selected' : '') + '>英式 en-GB</option></select></div>' +
          '<div class="form-row"><label>朗读语速 ' + st.rate + 'x</label><input type="range" min="0.5" max="1.3" step="0.05" value="' + st.rate + '" data-change="set-rate"></div>' +
          '<div class="form-row"><label>自动朗读</label><input type="checkbox"' + (st.autoSpeak ? ' checked' : '') + ' data-change="set-auto"></div>' +
          '<div class="row center-row">' + ui.btn('试听一句', 'speak', { id: 'Good morning, thanks for making the time today.', cls: 'sm' }) + '</div>' +
          '<p class="muted mini">浏览器支持的音色数量有限，Chrome + Windows/macOS 质量最好。</p>') +
        ui.card('<b>AI 深度点评（可选·需 API Key）</b>' +
          '<p class="muted">不填也能用：本地引擎已完成流利度/词汇/语法/发音打分。填了之后，「报告」里会出现大模型给出的逐句精批与润色版本。</p>' +
          '<div class="form-row"><label>启用</label><input type="checkbox"' + (llm.enabled ? ' checked' : '') + ' data-change="llm-enabled"></div>' +
          '<div class="form-row"><label>Base URL</label><input class="input" value="' + U.esc(llm.baseUrl) + '" data-change="llm-base"></div>' +
          '<div class="form-row"><label>API Key</label><input class="input" type="password" value="' + U.esc(llm.apiKey) + '" placeholder="sk-…" data-change="llm-key"></div>' +
          '<div class="form-row"><label>模型</label><input class="input" value="' + U.esc(llm.model) + '" data-change="llm-model"></div>' +
          '<p class="muted mini">支持任何 OpenAI 兼容接口（含 DeepSeek、通义、月之暗面、本地 Ollama 等）。Key 只存在你本机浏览器。</p>') +
        ui.card('<b>内容更新</b>' +
          '<p class="muted">单词、跟读素材、情景脚本、视频包都以「内容包」形式下发，打开应用时自动检查；本地 file:// 打开时不联网，仅使用内置与已缓存内容。</p>' +
          '<div class="row spread mini"><span>当前内容版本</span><b>v' + App.content.state.version + '</b></div>' +
          '<div class="row spread mini"><span>上次更新</span><b>' + (App.content.state.updatedAt || '尚未更新') + '</b></div>' +
          '<div class="row spread mini"><span>已缓存内容包</span><b>' + App.content.state.packCount + ' 个（+词汇 ' + App.extra.vocab.length + ' 条 / +视频 ' + App.extra.videos.length + ' 个）</b></div>' +
          '<div class="form-row"><label>内容源地址</label><input class="input" value="' + U.esc(st.contentSource || './') + '" placeholder="默认 ./（与本应用同目录）" data-change="set-source"></div>' +
          '<div class="row wrap">' + ui.btn('立即检查更新', 'content-check', { cls: 'primary sm' }) +
          ui.btn('清空内容缓存', 'content-reset', { cls: 'sm' }) + '</div>') +
        ui.card('<b>数据</b><p class="muted">全部学习记录保存在本机 localStorage，不上传任何服务器。</p>' +
          '<div class="row wrap">' + ui.btn('导出备份 JSON', 'set-export', { cls: 'sm' }) +
          '<label class="btn sm ghost">导入备份<input type="file" accept="application/json" hidden data-change="set-import"></label>' +
          ui.btn('清空全部数据', 'set-reset', { cls: 'sm danger' }) + '</div>') +
        ui.card('<b>关于</b><p class="muted">VocaBridge · 雅思 + 海外求职版。题库与素材均为内置/原创仿写；情景脚本、语法规则、评分维度按 IELTS Speaking 标准设计。</p>' +
          '<p class="muted mini">建议用 Chrome / Edge 打开以获得语音识别（ASR）能力；Safari 部分支持，可在打字模式下使用。</p>');
    }
  };

  ui.on('set-goal', function (a) { S.state.settings.dailyGoal = parseInt(a.el.value, 10) || 40; S.save(); });
  ui.on('set-name', function (a) { S.state.profile.name = a.el.value.trim(); S.save(); });
  ui.on('set-accent', function (a) { S.state.settings.accent = a.el.value; S.save(); App.tts.speak('Hello, this is a quick test.', { accent: a.el.value }); });
  ui.on('set-rate', function (a) { S.state.settings.rate = parseFloat(a.el.value); S.save(); App.views.settings.render(document.getElementById('view')); App.tts.speak('Rate test.', { rate: parseFloat(a.el.value) }); });
  ui.on('set-auto', function (a) { S.state.settings.autoSpeak = a.el.checked; S.save(); });
  ui.on('llm-enabled', function (a) { S.state.settings.llm.enabled = a.el.checked; S.save(); U.toast(a.el.checked ? '已启用大模型点评' : '已关闭'); });
  ui.on('llm-base', function (a) { S.state.settings.llm.baseUrl = a.el.value.trim(); S.save(); });
  ui.on('llm-key', function (a) { S.state.settings.llm.apiKey = a.el.value.trim(); S.save(); });
  ui.on('llm-model', function (a) { S.state.settings.llm.model = a.el.value.trim(); S.save(); });
  ui.on('set-source', function (a) { S.state.settings.contentSource = a.el.value.trim(); S.save(); });
  ui.on('content-check', function () {
    U.toast('正在检查内容更新…');
    App.content.check().then(function (r) {
      U.toast(r.message || (r.updated ? '更新成功' : '已是最新'));
      App.views.settings.render(document.getElementById('view'));
    });
  });
  ui.on('content-reset', function () {
    App.content.reset();
    U.toast('内容缓存已清空，刷新页面后生效');
    App.views.settings.render(document.getElementById('view'));
  });
  ui.on('set-export', function () {
    var blob = new Blob([S.exportJSON()], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'vocabridge-backup-' + U.today() + '.json';
    a.click(); U.toast('已导出备份');
  });
  ui.on('set-import', function (a) {
    var f = a.el.files && a.el.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      if (S.importJSON(rd.result)) { U.toast('导入成功'); App.router.go('#/today'); }
      else U.toast('文件格式不正确');
    };
    rd.readAsText(f);
  });
  ui.on('set-reset', function () {
    ui.modal('确认清空？', '<p class="muted">所有学习进度、错词本、口语记录都会被删除，无法恢复。</p>',
      ui.btn('确认清空', 'set-reset2', { cls: 'danger' }) + ui.btn('取消', 'close-modal', {}));
  });
  ui.on('set-reset2', function () { S.reset(); ui.closeModal(); App.router.go('#/today'); U.toast('已清空'); });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== js/app.js ===== */
/* ===========================================================
 * 路由与启动
 * =========================================================== */
(function (root) {
  'use strict';
  var App = root.App, U = App.util, S = App.store;

  var NAV = [
    { key: 'today', hash: '#/today', icon: '🏠', label: '今日' },
    { key: 'vocab', hash: '#/vocab', icon: '📖', label: '单词' },
    { key: 'grammar', hash: '#/grammar', icon: '✍️', label: '语法' },
    { key: 'exam', hash: '#/exam', icon: '🏅', label: '测评' },
    { key: 'speaking', hash: '#/speaking', icon: '🎙️', label: '口语' },
    { key: 'review', hash: '#/review', icon: '🔁', label: '复习' },
    { key: 'stats', hash: '#/stats', icon: '📊', label: '报告' },
    { key: 'settings', hash: '#/settings', icon: '⚙️', label: '设置' }
  ];
  var TABS = ['today', 'vocab', 'exam', 'speaking', 'review'];

  var router = {
    cur: '#/today',
    go: function (hash) {
      hash = hash || '#/today';
      if (location.hash === hash) router.render();
      else location.hash = hash;
    },
    render: function () {
      var key = (location.hash || '#/today').replace('#/', '') || 'today';
      var v = App.views[key] || App.views.today;
      router.cur = location.hash;
      document.getElementById('title').textContent = v.title;
      document.getElementById('subTitle').textContent =
        key === 'today' ? U.today() : (key === 'speaking' ? '情景 · 跟读 · AI 打分' : '');
      App.util.qsa('[data-nav]').forEach(function (b) {
        b.classList.toggle('on', b.getAttribute('data-nav') === key);
      });
      App.tts.stop();
      if (App.asr.supported() && App.asr.stop) App.asr.stop();
      v.render(document.getElementById('view'));
      window.scrollTo(0, 0);
    }
  };
  App.router = router;

  function boot() {
    S.load();

    // 先应用本地缓存的内容包（离线也要有新内容）
    try { App.content.applyCached(); } catch (e) { console.warn('内容包应用失败', e); }

    document.getElementById('nav').innerHTML = NAV.map(function (n) {
      return '<button class="nav-item" data-nav="' + n.key + '" data-act="go" data-val="' + n.hash + '"><i>' + n.icon + '</i>' + n.label + '</button>';
    }).join('');
    document.getElementById('tabbar').innerHTML = '<div class="row">' + NAV.filter(function (n) { return TABS.indexOf(n.key) >= 0; }).map(function (n) {
      return '<button class="nav-item" data-nav="' + n.key + '" data-act="go" data-val="' + n.hash + '"><i>' + n.icon + '</i>' + n.label + '</button>';
    }).join('') + '</div>';

    window.addEventListener('hashchange', router.render);
    if (!location.hash) location.hash = '#/today';
    router.render();

    // 后台静默检查内容更新（仅 http/https 场景；失败静默降级）
    setTimeout(function () {
      if (/^https?:/i.test(location.protocol)) {
        App.content.check().then(function (r) {
          if (r && r.updated) U.toast(r.message + '，刷新后展示最新内容');
        });
      }
    }, 3000);

    // 学习时长统计（每 60 秒累加 1 分钟）
    setInterval(function () {
      if (document.visibilityState === 'visible') S.bump('minutes', 1);
    }, 60000);

    // 首次使用提示
    var onboarded = false, isNew = false;
    try {
      onboarded = localStorage.getItem('vocabridge_onboarded') === '1';
      if (!onboarded) { localStorage.setItem('vocabridge_onboarded', '1'); isNew = true; }
    } catch (e) { isNew = true; }
    if (isNew && !onboarded) {
      setTimeout(function () {
        App.ui.modal('欢迎使用 VocaBridge',
          '<p>这是一个 offline 可用的英语学习工具，全部数据只存在你本机浏览器。</p>' +
          '<ul><li><b>学</b>：单词卡片 + 语法专题</li><li><b>练</b>：选择题 / 拼写 / 听写 / 情景对话 / 影子跟读</li>' +
          '<li><b>评</b>：AI 口语老师按雅思四项标准打分并逐句纠错</li>' +
          '<li><b>复习</b>：SM-2 间隔重复 + 错词本自动排队</li></ul>' +
          '<p class="muted">建议用 <b>Chrome / Edge</b> 打开以支持语音识别；其他浏览器会自动切换为打字模式。</p>',
          App.ui.btn('开始学习', 'close-modal', { cls: 'primary' }));
      }, 600);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
