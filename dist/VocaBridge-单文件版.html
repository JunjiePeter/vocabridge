    sents.forEach(function (s) {
      GRAMMAR_RULES.forEach(function (r) {
        var m = s.match(r.re);
        if (m) {
          var key = r.fix + m[0];
          if (seen[key]) return;
          seen[key] = 1;
          out.push({ type: 'grammar', original: m[0], suggestion: r.fix, reason: r.note, sentence: s });
        }
      });
      PAIR_RULES.forEach(function (p) {
        if (p.a.test(s) && p.b.test(s)) {
          var key = 'pair' + p.note;
          if (seen[key]) return; seen[key] = 1;
          out.push({ type: 'grammar', original: s.length > 60 ? s.slice(0, 60) + '…' : s, suggestion: p.fix, reason: p.note, sentence: s });
        }
      });
      // 第三人称单数缺 -s
      var third = s.match(/\b(he|she|it)\s+([a-z]+)\b/i);
      if (third) {
        var v = third[2].toLowerCase();
        if (VERB_THIRD[v] && !/\b(not|n't)\b/.test(s)) {
          var key2 = 'third' + third[0];
          if (!seen[key2]) {
            seen[key2] = 1;
            out.push({
              type: 'grammar', original: third[0], suggestion: third[1] + ' ' + VERB_THIRD[v],
              reason: '第三人称单数一般现在时，动词要加 -s。', sentence: s
            });
          }
        }
      }
      // 缺冠词：I am / He is + 职业名词
      var art = s.match(/\b(i\s+am|he\s+is|she\s+is)\s+(student|teacher|engineer|developer|manager|intern|analyst|designer|researcher|candidate)\b/i);
      if (art) {
        var key3 = 'art' + art[0];
        if (!seen[key3]) {
          seen[key3] = 1;
          out.push({ type: 'grammar', original: art[0], suggestion: art[1] + ' a ' + art[2], reason: '可数名词单数不能没有冠词。', sentence: s });
        }
      }
      // 过去时间 + 动词原形
      var past = s.match(/\b(yesterday|last\s+(year|month|week|night|semester)|ago)\b[^.!?]*\b(go|goes|come|comes|see|sees|take|takes|buy|buys|get|gets|make|makes|do|does|have|has|eat|eats|meet|meets|give|gives|leave|leaves|start|starts|finish|finishes)\b/i);
      if (past) {
        var key4 = 'past' + past[0];
        if (!seen[key4]) {
          seen[key4] = 1;
          out.push({ type: 'grammar', original: past[0], suggestion: '改用过去式动词', reason: '与明确的过去时间状语连用，须用一般过去时。', sentence: s });
        }
      }
    });
    return out;
  }

  /* ---------- 词汇分析 ---------- */
  function checkLexis(text) {
    var W = words(text), low = ' ' + text.toLowerCase() + ' ';
    var counts = {}, total = 0, i, w;
    for (i = 0; i < W.length; i++) {
      w = W[i];
      if (COMMON_WORDS.test(w)) continue;
      counts[w] = (counts[w] || 0) + 1; total++;
    }
    var uniq = Object.keys(counts).length;
    var ttr = W.length ? uniq / Math.max(1, W.length) : 0;

    var suggestions = [];
    UPGRADES.forEach(function (p) {
      var re = new RegExp('(^|[^a-z])' + p[0].replace(/[.*+?^${}()|[\]\\]/g, '\\</body>') + '([^a-z]|$)', 'i');
      if (re.test(low) && suggestions.length < 6) {
        suggestions.push({ type: 'lexis', original: p[0], suggestion: p[1], reason: '雅思 Lexical Resource 建议替换为更精准的表达。' });
      }
    });

    // 重复词（同一实词出现 >= 3 次）
    Object.keys(counts).forEach(function (k) {
      if (counts[k] >= 3 && suggestions.length < 8) {
        suggestions.push({ type: 'lexis', original: k, suggestion: '使用同义替换或代词指代', reason: '同一实词重复出现 ' + counts[k] + ' 次，影响词汇多样性。' });
      }
    });

    // 命中目标词库的加分项
    var hitVocab = [];
    try {
      var pool = (root.App.VOCAB_IELTS || []).concat(root.App.VOCAB_WORK || []);
      pool.forEach(function (v) {
        var re = new RegExp('(^|[^a-z])' + v.word.replace(/[.*+?^${}()|[\]\\]/g, '\\</body>') + '([a-z]|$)', 'i');
        if (re.test(text)) hitVocab.push(v.word);
      });
    } catch (e) { }

    return { ttr: ttr, uniq: uniq, total: total, suggestions: suggestions, hitVocab: hitVocab.slice(0, 12) };
  }

  /* ---------- 流利度 ---------- */
  function checkFluency(text, meta) {
    meta = meta || {};
    var W = words(text);
    var n = W.length;
    var durMs = meta.durationMs || (n ? (n / 130) * 60000 : 0);
    var minutes = Math.max(durMs / 60000, 0.05);
    var wpm = Math.round(n / minutes);

    var fm = String(text || '').match(FILLERS) || [];
    var fillers = fm.map(function (x) { return x.toLowerCase().trim(); });
    var distinctFillers = {};
    fillers.forEach(function (f) { distinctFillers[f] = (distinctFillers[f] || 0) + 1; });

    // 停顿估算：基于 ASR 分段
    var segs = meta.segments || [];
    var pauses = 0, longPauses = 0;
    if (segs.length > 1) {
      var prev = segs[0].t || 0;
      for (var i = 1; i < segs.length; i++) {
        var gap = (segs[i].t || 0) - prev;
        var expect = (segs[i].text.split(/\s+/).length / Math.max(60, wpm)) * 60000; // 说话时长估算
        var silent = gap - expect;
        if (silent > 900) { pauses++; if (silent > 2500) longPauses++; }
        prev = segs[i].t || 0;
      }
    }

    var sentsCount = sentences(text).length;
    var avgSentLen = sentsCount ? n / sentsCount : 0;
    var discourse = (String(text).match(DISCOURSE) || []).length;
    var subordinates = (String(text).match(SUBORDINATORS) || []).length;

    // 负向：连续重复（stutter I I I）
    var stutter = (String(text).toLowerCase().match(/\b(\w+)( \1\b){1,}/g) || []).length;

    return {
      words: n, minutes: U.round1(minutes), wpm: wpm,
      fillerCount: fillers.length, fillerPer100: U.round1((fillers.length / Math.max(1, n)) * 100),
      fillerWords: Object.keys(distinctFillers),
      pauses: pauses, longPauses: longPauses, stutter: stutter,
      sentenceCount: sentsCount, avgSentLen: U.round1(avgSentLen),
      discourse: discourse, subordinates: subordinates
    };
  }

  /* ---------- 发音：与参考文本比对 ---------- */
  function checkPronunciation(text, reference) {
    if (!reference) return null;
    var ref = words(reference), hyp = words(text);
    var ops = U.align(ref, hyp);
    var correct = ops.filter(function (o) { return o.t === 'ok'; }).length;
    var accuracy = ref.length ? correct / ref.length : 0;
    var missed = ops.filter(function (o) { return o.t === 'del'; }).map(function (o) { return o.ref; });
    var sub = ops.filter(function (o) { return o.t === 'sub'; }).map(function (o) { return { ref: o.ref, got: o.hyp }; });
    var extra = ops.filter(function (o) { return o.t === 'ins'; }).map(function (o) { return o.hyp; });
    return {
      accuracy: U.round1(accuracy), missed: missed, substituted: sub, extra: extra,
      wer: U.round1(1 - accuracy)
    };
  }

  /* ---------- 打分映射 ---------- */
  function bandFluency(f) {
    var base;
    if (f.wpm >= 150) base = 8.5; else if (f.wpm >= 130) base = 8; else if (f.wpm >= 110) base = 7.5;
    else if (f.wpm >= 90) base = 7; else if (f.wpm >= 70) base = 6.5; else if (f.wpm >= 50) base = 6; else base = 5;
    var     pen = 0;
    if (f.fillerPer100 > 6) pen += 1.5; else if (f.fillerPer100 > 3) pen += 1; else if (f.fillerPer100 > 1.5) pen += 0.5;
    if (f.longPauses > 2) pen += 1; else if (f.longPauses > 0) pen += 0.5;
    if (f.stutter > 2) pen += 0.5;
    if (f.discourse >= 2) pen -= 0.25;
    if (f.words < 30) pen += 0.5;   // 内容太少，无法稳定判断
    return U.clamp(U.toHalf(base - pen), 4, 9);
  }
  function bandLexis(l, f) {
    var base;
    if (l.ttr >= 0.62) base = 8; else if (l.ttr >= 0.55) base = 7.5; else if (l.ttr >= 0.48) base = 7;
    else if (l.ttr >= 0.42) base = 6.5; else if (l.ttr >= 0.35) base = 6; else base = 5.5;
    if (l.hitVocab.length >= 4) base += 0.5; else if (l.hitVocab.length >= 2) base += 0.25;
    if (f.words < 25) base -= 0.5;
    return U.clamp(U.toHalf(base), 4, 9);
  }
  function bandGrammar(errors, f) {
    var g = 7.5;
    g -= Math.min(3, errors.length * 0.5);
    if (f.subordinates >= 3) g += 0.5;
    if (f.avgSentLen > 15) g += 0.25;
    if (f.sentenceCount <= 1 && f.words > 40) g -= 0.5;
    if (f.words < 30) g = Math.min(g, 6.5);  // 样本太少，无法证明句法多样性
    return U.clamp(U.toHalf(g), 4, 9);
  }
  function bandPronunciation(p, f, confidence) {
    if (p) {
      var a = p.accuracy;
      var b;
      if (a >= 0.99) b = 9; else if (a >= 0.96) b = 8.5; else if (a >= 0.92) b = 8; else if (a >= 0.86) b = 7.5;
      else if (a >= 0.78) b = 7; else if (a >= 0.68) b = 6.5; else if (a >= 0.55) b = 6; else b = 5;
      if (f.words < 3) b = 5;
      return U.clamp(U.toHalf(b), 4, 9);
    }
    if (confidence != null) {
      return U.clamp(U.toHalf(5 + confidence * 4), 4, 9);
    }
    return null;
  }

  /* ---------- 主入口 ---------- */
  function analyze(opt) {
    opt = opt || {};
    var text = (opt.text || '').trim();
    var f = checkFluency(text, opt);
    var l = checkLexis(text);
    var errors = checkGrammar(text);
    var p = checkPronunciation(text, opt.reference);

    var sF = bandFluency(f), sL = bandLexis(l, f), sG = bandGrammar(errors, f), sP = bandPronunciation(p, f, opt.confidence);
    var dims = [sF, sL, sG];
    if (sP != null) dims.push(sP);
    var overall = U.toHalf(dims.reduce(function (a, b) { return a + b; }, 0) / dims.length);

    // 通用改进建议
    var tips = [];
    if (f.words < 30) tips.push('回答偏短。雅思/面试回答建议 60-120 词，面试官追问时会更轻松。');
    if (f.fillerPer100 > 3) tips.push('填充词偏多（' + f.fillerWords.slice(0, 4).join('、') + '）。宁可停顿 1 秒，也不要用 um / like 填补空白。');
    if (f.longPauses > 0) tips.push('出现超过 2.5 秒的长停顿，建议用衔接词占位："That\'s a good question — let me think for a second."');
    if (f.subordinates < 2 && f.words > 40) tips.push('句子偏简单，试着加入 because / although / which 等从句，GRA 分数会明显上升。');
    if (l.ttr < 0.45) tips.push('用词重复度高，试着换掉重复出现的实词。');
    if (errors.length) tips.push('本次检测到 ' + errors.length + ' 处语法/搭配问题，优先修最有把握的三条。');
    if (p && p.wer > 0.2) tips.push('跟读匹配度偏低，把标红的词单独慢速重读三遍再整句跟读。');
    if (!tips.length) tips.push('整体不错，下一步可以把重心放在内容组织（PEEL 结构）上。');

    return {
      text: text, metrics: f, lexis: l, errors: errors,
      pronunciation: p, tips: tips,
      scores: { fluency: sF, vocabulary: sL, grammar: sG, pronunciation: sP, overall: overall },
      hasPronunciation: sP != null
    };
  }

  /* ---------- LLM 深度点评（可选） ---------- */
  function deep(opt) {
    var st = root.App.store.state.settings.llm;
    if (!st || !st.enabled || !st.apiKey) return Promise.reject(new Error('LLM 未配置'));
    var text = opt.text || '';
    var prompt = [
      'You are an IELTS Speaking examiner and a senior hiring coach for English-speaking tech companies.',
      'Assess the candidate answer below.',
      '',
      'Task / question: ' + (opt.task || 'open speaking'),
      'Scenario: ' + (opt.scenario || 'general'),
      'Reference answer (may be empty): ' + (opt.reference || ''),
      'Candidate answer: "' + text + '"',
      '',
      'Reply with STRICT JSON only, no markdown fences, with this schema:',
      '{"fluency":7.0,"vocabulary":6.5,"grammar":7.0,"pronunciation":6.5,"overall":7.0,',
      '"verdict":"2 sentences of examiner comment",',
      '"corrections":[{"original":"wrong part","suggestion":"fixed","reason":"short Chinese reason"}],',
      '"upgradeSuggestions":["advice1","advice2"],',
      '"polishedVersion":"an improved version of the candidate answer, 30-80 words"}'
    ].join('\n');

    return fetch(st.baseUrl.replace(/\/$/, '') + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + st.apiKey },
      body: JSON.stringify({
        model: st.model || 'gpt-4o-mini',
        messages: [
          { role: 'system', content: 'You assess spoken English for IELTS and job interviews. Always answer in strict JSON.' },
          { role: 'user', content: prompt }
        ],
        temperature: 0.4
      })
    }).then(function (r) {
      if (!r.ok) throw new Error('API ' + r.status);
      return r.json();
    }).then(function (j) {
      var content = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
      content = content.replace(/```json/gi, '').replace(/```/g, '').trim();
      return JSON.parse(content);
    });
  }

  root.App.eval = { analyze: analyze, deep: deep, checkGrammar: checkGrammar, checkLexis: checkLexis, checkPronunciation: checkPronunciation, sentences: sentences };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== js/content.js ===== */
/* ===========================================================
 * 内容热更新体系
 * - content/manifest.json 描述版本与包清单
 * - content/packs/*.json 是实际内容包（单词/语法/跟读/情景/话题卡/视频）
 * - 运行时先应用本地缓存包，再后台静默检查远程版本
 * - 本地 file:// 下 fetch 失败时自动静默降级，不影响内置内容
 * =========================================================== */
(function (root) {
  'use strict';
  var App = root.App, U = App.util, S = App.store;

  App.extra = App.extra || { vocab: [], videos: [] };

  var CACHE_KEY = 'vocabridge_content_v1';

  function readCache() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      return raw ? JSON.parse(raw) : { version: 0, updatedAt: null, packs: {} };
    } catch (e) { return { version: 0, updatedAt: null, packs: {} }; }
  }
  function writeCache(c) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(c)); } catch (e) { }
  }

  function dedupe(list, idKey) {
    var seen = {}, out = [];
    list.forEach(function (x) {
      var k = x[idKey];
      if (!seen[k]) { seen[k] = 1; out.push(x); }
    });
    return out;
  }

  function applyPack(pack) {
    if (!pack || !pack.type) return 0;
    var n = 0;
    switch (pack.type) {
      case 'vocab':
        (pack.items || []).forEach(function (r, i) {
          var id = 'X' + pack.id + '_' + i;
          var exists = App.extra.vocab.concat(App.VOCAB_IELTS || [], App.VOCAB_WORK || [])
            .some(function (w) { return w.word.toLowerCase() === String(r[0]).toLowerCase(); });
          if (!exists) {
            App.extra.vocab.push({
              id: id, deck: pack.deck || 'ielts', word: r[0], phon: r[1] || '', pos: r[2] || '',
              cn: r[3] || '', ex: r[4] || '', exCn: r[5] || '', tag: pack.tag || 'extra'
            });
            n++;
          }
        });
        break;
      case 'grammar':
        (pack.items || []).forEach(function (t) {
          if (!App.GRAMMAR.some(function (g) { return g.id === t.id; })) { App.GRAMMAR.push(t); n++; }
        });
        break;
      case 'passage':
        (pack.items || []).forEach(function (p) {
          if (!App.PASSAGES.some(function (x) { return x.id === p.id; })) { App.PASSAGES.push(p); n++; }
        });
        break;
      case 'scenario':
        (pack.items || []).forEach(function (s) {
          if (!App.SCENARIOS.some(function (x) { return x.id === s.id; })) { App.SCENARIOS.push(s); n++; }
        });
        break;
      case 'cue':
        (pack.items || []).forEach(function (c) {
          if (!App.CUES.some(function (x) { return x.t === c.t; })) { App.CUES.push(c); n++; }
        });
        break;
      case 'video':
        (pack.items || []).forEach(function (v) {
          if (!App.extra.videos.some(function (x) { return x.id === v.id; })) { App.extra.videos.push(v); n++; }
        });
        break;
    }
    return n;
  }

  var content = {
    state: readCache(),

    applyCached: function () {
      var c = content.state, total = 0;
      Object.keys(c.packs).forEach(function (id) { total += applyPack(c.packs[id]); });
      return total;
    },

    sourceBase: function () {
      var s = S.state.settings.contentSource || './';
      return s.replace(/\/?$/, '/');
    },

    // 拉取 manifest，发现新版本则下载并应用
    check: function () {
      var base = content.sourceBase();
      return fetch(base + 'content/manifest.json?v=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (m) {
          if (!m || typeof m.version !== 'number') throw new Error('manifest 格式不正确');
          var cur = content.state;
          if (m.version <= (cur.version || 0)) {
            return { updated: false, message: '已是最新版本 v' + cur.version };
          }
          // 逐个拉包（跳过已缓存且版本相同的）
          var downloads = (m.packs || []).map(function (p) {
            var cached = cur.packs[p.id];
            if (cached && cached.packVersion === p.version) return Promise.resolve(null);
            return fetch(base + p.file).then(function (r) {
              if (!r.ok) throw new Error(p.file + ' 加载失败');
              return r.json();
            }).then(function (data) {
              data.packVersion = p.version;
              cur.packs[p.id] = data;
            });
          });
          return Promise.all(downloads).then(function () {
            var added = 0;
            (m.packs || []).forEach(function (p) { added += applyPack(cur.packs[p.id]); });
            cur.version = m.version; cur.updatedAt = m.updatedAt || U.today();
            writeCache(cur);
            return { updated: true, version: m.version, added: added, message: '已更新到 v' + m.version + '，新增/合并 ' + added + ' 项内容' };
          });
        })
        .catch(function (e) {
          return { updated: false, error: true, message: '更新失败：' + (e.message || e) + '（内置内容不受影响）' };
        });
    },

    reset: function () {
      try { localStorage.removeItem(CACHE_KEY); } catch (e) { }
      content.state = { version: 0, updatedAt: null, packs: {} };
    },

    status: function () {
      var c = content.state;
      return {
        version: c.version, updatedAt: c.updatedAt,
        packCount: Object.keys(c.packs).length,
        extraVocab: App.extra.vocab.length, extraVideos: App.extra.videos.length
      };
    }
  };

  App.content = content;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== js/ui.js ===== */
/* ===========================================================
 * UI 基础层：事件总线（事件委托）+ 常用组件片段
 * 所有交互用 data-act 属性驱动，重渲染后无需重新绑定
 * =========================================================== */
(function (root) {
  'use strict';
  var U = root.App.util;

  var handlers = {};

  function on(name, fn) { handlers[name] = fn; }
  function fire(name, el, ev) {
    if (!handlers[name]) {
      if (U && U.toast) U.toast('该功能暂未加载：' + name);
      return;
    }
    try {
      handlers[name]({
        el: el, ev: ev,
        id: el && el.getAttribute ? el.getAttribute('data-id') : undefined,
        val: el && el.getAttribute ? el.getAttribute('data-val') : undefined,
        data: (el && el.dataset) || {}
      });
    } catch (e) {
      console.error('[handler:' + name + ']', e);
      if (U && U.toast) U.toast('操作失败：' + (e && e.message ? e.message : String(e)));
    }
  }

  // 全局错误可视化：任何浏览器兼容问题都会弹出来，不会静默死掉
  window.addEventListener('error', function (e) {
    var t = document.getElementById('toast');
    if (t && e && e.message) {
      t.textContent = '页面出错了：' + e.message + '（可截图反馈）';
      t.className = 'toast show bad';
      clearTimeout(t._t); t._t = setTimeout(function () { t.className = 'toast'; }, 4500);
    }
  }, true);
  window.addEventListener('unhandledrejection', function (e) { console.error('Promise rejection:', e.reason); });

  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t) return;
    e.preventDefault();
    fire(t.getAttribute('data-act'), t, e);
  });

  document.addEventListener('change', function (e) {
    var t = e.target.closest ? e.target.closest('[data-change]') : null;
    if (!t) return;
    fire(t.getAttribute('data-change'), t, e);
  });

  document.addEventListener('input', function (e) {
    var t = e.target.closest ? e.target.closest('[data-input]') : null;
    if (!t) return;
    fire(t.getAttribute('data-input'), t, e);
  });

  /* ---------- 片段构造 ---------- */
  function card(body, cls) { return '<div class="card ' + (cls || '') + '">' + body + '</div>'; }
  function btn(label, act, opts) {
    opts = opts || {};
    return '<button class="btn ' + (opts.cls || '') + '" data-act="' + act + '"' +
      (opts.id ? ' data-id="' + opts.id + '"' : '') + (opts.val ? ' data-val="' + opts.val + '"' : '') +
      (opts.title ? ' title="' + opts.title + '"' : '') + '>' + label + '</button>';
  }
  function muted(s) { return '<span class="muted">' + s + '</span>'; }
  function bar(pct, cls) {
    return '<div class="progress"><i class="' + (cls || '') + '" style="width:' + U.clamp(pct, 0, 100) + '%"></i></div>';
  }
  function ring(pct, label, sub) {
    var v = U.clamp(pct, 0, 100);
    var r = 34, c = 2 * Math.PI * r;
    return '<div class="ring"><svg viewBox="0 0 84 84">' +
      '<circle class="ring-bg" cx="42" cy="42" r="' + r + '"></circle>' +
      '<circle class="ring-fg" cx="42" cy="42" r="' + r + '" stroke-dasharray="' + c + '" stroke-dashoffset="' + (c * (1 - v / 100)) + '"></circle>' +
      '</svg><div class="ring-txt"><b>' + label + '</b><span>' + (sub || '') + '</span></div></div>';
  }
  function chips(list, act, activeId) {
    return '<div class="chips">' + list.map(function (c) {
      return '<button class="chip ' + (c.id === activeId ? 'on' : '') + '" data-act="' + act + '" data-val="' + c.id + '">' + c.label + '</button>';
    }).join('') + '</div>';
  }
  function empty(title, desc) {
    return '<div class="empty"><div class="empty-ico">📭</div><b>' + title + '</b><p>' + (desc || '') + '</p></div>';
  }
  function modal(title, bodyHtml, footerHtml) {
    var root_ = document.getElementById('modal-root');
    root_.innerHTML = '<div class="modal-mask" data-act="close-modal"><div class="modal" onclick="event.stopPropagation()">' +
      '<div class="modal-head"><b>' + title + '</b><button class="x" data-act="close-modal">✕</button></div>' +
      '<div class="modal-body">' + bodyHtml + '</div>' +
      (footerHtml ? '<div class="modal-foot">' + footerHtml + '</div>' : '') +
      '</div></div>';
    root_.classList.add('show');
  }
  function closeModal() {
    var root_ = document.getElementById('modal-root');
    root_.innerHTML = '';
    root_.classList.remove('show');
  }

  function speakBtn(text, opts) {
    opts = opts || {};
    return '<button class="spk" title="朗读" data-act="' + (opts.act || 'speak') + '" data-id="' + U.esc(text) + '"' +
      (opts.accent ? ' data-accent="' + opts.accent + '"' : '') + '>🔊</button>';
  }

  root.App.ui = {
    on: on, fire: fire,
    card: card, btn: btn, muted: muted, bar: bar, ring: ring, chips: chips,
    empty: empty, modal: modal, closeModal: closeModal, speakBtn: speakBtn
  };

  /* 通用：朗读 */
  on('speak', function (a) {
    var txt = a.el.getAttribute('data-id') || '';
    var acc = a.el.getAttribute('data-accent');
    root.App.tts.speak(txt, { accent: acc });
  });
  on('close-modal', function () { closeModal(); });

  // 兜底：任何脚本文件加载失败也提醒
  window.addEventListener('load', function () {
    if (!root.App || !root.App.views || !root.App.views.today) {
      U.toast('核心脚本未加载完整，请刷新或换用 Chrome / Edge 打开');
    }
  });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== js/views-vocab.js ===== */
/* ===========================================================
 * 单词模块：词库访问 + 学习 / 练习 / 拼写 / 词库列表 / 会话
 * 参考扇贝「初识→练习→自评→间隔复习」闭环
 * =========================================================== */
(function (root) {
  'use strict';
  var App = root.App, U = App.util, S = App.store, srs = App.srs, ui = App.ui;

  /* ---------- 数据访问 ---------- */
  var vocab = {
    all: function (deck) {
      var a = (root.App.VOCAB_IELTS || []).concat(root.App.VOCAB_WORK || [], (root.App.extra && root.App.extra.vocab) || []);
      if (!deck || deck === 'all') return a;
      return a.filter(function (w) { return w.deck === deck; });
    },
    byId: function (id) {
      var a = vocab.all();
      for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i];
      return null;
    },
    decks: [
      { id: 'ielts', label: '雅思核心' },
      { id: 'work', label: '求职职场' },
      { id: 'all', label: '全部' }
    ],
    stats: function (deck) {
      var list = vocab.all(deck), s = S.state.words, seen = 0, mastered = 0;
      list.forEach(function (w) {
        var p = s[w.id];
        if (p && p.seen) seen++;
        if (p && p.mastered) mastered++;
      });
      return { total: list.length, seen: seen, mastered: mastered };
    }
  };
  App.vocab = vocab;

  /* ---------- 会话状态 ---------- */
  var SS = {
    mode: null, items: [], i: 0, ok: 0, bad: 0, wrongIds: [],
    q: null, phase: 'q', lastResult: null, revealed: false, cardWord: null
  };

  var MODES = [
    { id: 'learn', label: '初识卡片', desc: '新词先看，配例句+发音' },
    { id: 'quiz', label: '选择题', desc: '英选中 / 中选英 / 听音选义' },
    { id: 'spell', label: '拼写+听写', desc: '中文/音频提示下拼写' },
    { id: 'review', label: '到期复习', desc: '按遗忘曲线安排的组合练习' }
  ];

  /* ---------- 组题 ---------- */
  function makeQuestion(w, type) {
    var pool = vocab.all(S.state.settings.deck);
    var others = U.shuffle(pool.filter(function (x) { return x.id !== w.id; })).slice(0, 3);
    if (type === 'cn2en') {
      var opts = U.shuffle([w].concat(others).map(function (x) { return x.word; }));
      return { type: 'choice', prompt: w.cn + '  ' + w.pos, sub: '选出对应的英文单词', options: opts, answer: w.word, word: w };
    }
    if (type === 'listen') {
      var opts2 = U.shuffle([w.cn].concat(others.map(function (x) { return x.cn; })));
      return { type: 'choice', prompt: '🔊 听发音，选出正确释义', sub: '点击播放重听', options: opts2, answer: w.cn, word: w, audio: true };
    }
    var opts3 = U.shuffle([w.cn].concat(others.map(function (x) { return x.cn; })));
    return { type: 'choice', prompt: w.word, sub: w.phon + '  ' + w.pos, options: opts3, answer: w.cn, word: w };
  }

  function start(mode, list0) {
    var list = list0;
    if (!list) {
      var deck = S.state.settings.deck;
      var pool = vocab.all(deck);
      if (mode === 'review') list = srs.dueWords(deck === 'all' ? null : deck);
      else list = srs.newWords(pool, mode === 'learn' ? 15 : 20);
      if (mode !== 'review' && list.length < 5) list = U.shuffle(pool).slice(0, 15).map(function (w) { return w.id; });
    }
    if (!list.length) { U.toast(mode === 'review' ? '暂时没有到期单词，先去学新词吧' : '没有可用的单词'); return false; }
    SS.mode = mode; SS.items = U.shuffle(list); SS.i = 0; SS.ok = 0; SS.bad = 0; SS.wrongIds = []; SS.cardWord = null;
    next();
    App.router.go('#/vocab');
    return true;
  }

  function cur() { return vocab.byId(SS.items[SS.i]); }

  function next() {
    SS.phase = 'q'; SS.revealed = false; SS.lastResult = null;
    if (SS.i >= SS.items.length) { SS.mode = 'done'; return; }
    var w = cur();
    if (!w) { SS.i++; return next(); }
    if (SS.mode === 'learn') { SS.cardWord = w; if (S.state.settings.autoSpeak) root.App.tts.speak(w.word, {}); S.bump('learn'); }
    else if (SS.mode === 'spell') { SS.q = { type: 'spell', word: w }; if (S.state.settings.autoSpeak) root.App.tts.speak(w.word, {}); }
    else {
      var types = ['en2cn', 'cn2en', 'listen'];
      SS.q = makeQuestion(w, SS.mode === 'review' ? U.pick(types) : U.pick(types));
      if (SS.q.audio && S.state.settings.autoSpeak) root.App.tts.speak(w.word, {});
    }
    App.views.vocab.render(document.getElementById('view'));
  }

  function answerChoice(opt) {
    if (SS.phase !== 'q') return;
    var w = SS.q.word, right = opt === SS.q.answer;
    SS.phase = 'fb'; SS.lastResult = right ? 'ok' : 'no';
    if (right) { SS.ok++; srs.schedule(w.id, 3); }
    else { SS.bad++; srs.schedule(w.id, 0); SS.wrongIds.push(w.id); S.bump('review'); }
    S.bump(right ? 'learn' : 'review');
    App.views.vocab.render(document.getElementById('view'));
  }

  function gradeLearn(q) {
    var w = SS.cardWord;
    srs.schedule(w.id, q);
    if (q <= 1) SS.wrongIds.push(w.id);
    SS.i++; next();
  }

  function checkSpell(val) {
    var w = SS.q.word;
    var user = String(val || '').trim().toLowerCase().replace(/\s+/g, ' ');
    var target = w.word.toLowerCase();
    var right = user === target || user === target.replace(/\s*\(.*\)/, '');
    SS.phase = 'fb'; SS.lastResult = right ? 'ok' : 'no';
    SS.lastSpell = { user: user, target: target };
    if (right) { SS.ok++; srs.schedule(w.id, 3); }
    else { SS.bad++; srs.schedule(w.id, 0); SS.wrongIds.push(w.id); }
    S.bump(right ? 'learn' : 'review');
    App.views.vocab.render(document.getElementById('view'));
  }

  function manualGrade(quality) {
    var w = SS.mode === 'learn' ? SS.cardWord : SS.q.word;
    srs.schedule(w.id, quality);
  }

  /* ---------- 渲染 ---------- */
  function renderSession(el) {
    if (SS.mode === 'done') {
      var total = SS.ok + SS.bad, rate = total ? Math.round(SS.ok / total * 100) : 0;
      el.innerHTML =
        '<div class="card center">' +
        '<div class="done-ico">🎉</div><h3>本组完成</h3>' +
        '<div class="stat-row">' +
        '<div><b>' + SS.ok + '</b><span>正确</span></div>' +
        '<div><b>' + SS.bad + '</b><span>需巩固</span></div>' +
        '<div><b>' + rate + '%</b><span>正确率</span></div>' +
        '</div>' +
        '<p class="muted">' + (SS.wrongIds.length ? '错词已进入错词本，明天会优先出现在复习队列。' : '全部答对，系统已按遗忘曲线安排下次复习。') + '</p>' +
        '<div class="row center-row">' +
        ui.btn('再来一组', 'vocab-start', { cls: 'primary', val: SS.mode }) +
        (SS.wrongIds.length ? ui.btn('只练错词', 'vocab-startWrong', {}) : '') +
        ui.btn('返回', 'vocab-exit', {}) +
        '</div></div>';
      return;
    }

    var pct = Math.round(SS.i / SS.items.length * 100);
    var head = '<div class="sess-head"><div class="row spread"><span class="tag">' +
      (MODES.filter(function (m) { return m.id === SS.mode; })[0] || {}).label + '</span>' +
      '<span class="muted">' + (SS.i + 1) + ' / ' + SS.items.length + '</span></div>' + ui.bar(pct) +
      '<div class="row spread mini"><span class="ok-c">✓ ' + SS.ok + '</span><span class="bad-c">✗ ' + SS.bad + '</span></div></div>';

    if (SS.mode === 'learn') {
      var w = SS.cardWord;
      el.innerHTML = head +
        '<div class="card flash">' +
        '<div class="word-big">' + U.esc(w.word) + ui.speakBtn(w.word) + '</div>' +
        '<div class="phon">' + U.esc(w.phon) + ' <span class="tag sm">' + U.esc(w.pos) + '</span></div>' +
        (SS.revealed
          ? '<div class="mean"><b>' + U.esc(w.cn) + '</b></div>' +
          '<div class="ex-box"><div class="ex">' + U.esc(w.ex) + ui.speakBtn(w.ex) + '</div><div class="ex-cn">' + U.esc(w.exCn) + '</div></div>' +
          '<div class="row3">' +
          ui.btn('不认识', 'vocab-grade', { val: '0' }) +
          ui.btn('模糊', 'vocab-grade', { val: '1', cls: 'warn' }) +
          ui.btn('认识', 'vocab-grade', { val: '3', cls: 'ok' }) +
          '</div>'
          : '<div class="row center-row">' + ui.btn('显示释义', 'vocab-reveal', { cls: 'primary' }) + '</div>') +
        '</div>';
      return;
    }

    if (SS.mode === 'spell') {
      var ws = SS.q.word;
      el.innerHTML = head +
        '<div class="card">' +
        '<div class="prompt">' + U.esc(ws.cn) + '　<span class="tag sm">' + U.esc(ws.pos) + '</span></div>' +
        '<div class="muted mini">听录音或看中文拼写单词</div>' +
        '<div class="row center-row">' + ui.btn('🔊 播放单词', 'speak', { id: ws.word }) + ui.btn('🐢 慢速', 'vocab-slow', { id: ws.word }) + '</div>' +
        (SS.phase === 'fb'
          ? '<div class="fb ' + SS.lastResult + '">' +
          '<div class="fb-head">' + (SS.lastResult === 'ok' ? '✅ 拼写正确' : '❌ 正确拼写：' + U.esc(ws.word)) + '</div>' +
          (SS.lastResult === 'no' ? '<div class="diff">你写的：<code>' + U.esc(SS.lastSpell.user || '(空)') + '</code></div>' : '') +
          '<div class="ex-box"><div class="ex">' + U.esc(ws.ex) + ui.speakBtn(ws.ex) + '</div><div class="ex-cn">' + U.esc(ws.exCn) + '</div></div>' +
          '<div class="row3">' + ui.btn('标为认识', 'vocab-over', { val: '3', cls: 'ok' }) + ui.btn('下一个', 'vocab-next', { cls: 'primary' }) + ui.btn('结束', 'vocab-exit', {}) + '</div>' +
          '</div>'
          : '<div class="row"><input id="spellInput" class="input" placeholder="输入单词后回车" autocomplete="off" autocapitalize="off">' +
          ui.btn('提交', 'vocab-check', { cls: 'primary' }) + '</div>' +
          '<div class="row center-row">' + ui.btn('提示首字母', 'vocab-hint', {}) + '</div>') +
        '</div>';
      var inp = document.getElementById('spellInput');
      if (inp) { inp.focus(); inp.onkeydown = function (e) { if (e.key === 'Enter') document.querySelector('[data-act="vocab-check"]').click(); }; }
      return;
    }

    // 选择题
    var q = SS.q;
    el.innerHTML = head +
      '<div class="card">' +
      '<div class="prompt">' + U.esc(q.prompt) + (q.audio ? ' <span class="replay" data-act="speak" data-id="' + U.esc(q.word.word) + '">🔊</span>' : '') + '</div>' +
      '<div class="muted mini">' + U.esc(q.sub) + '</div>' +
      '<div class="opts">' + q.options.map(function (o) {
        var cls = '';
        if (SS.phase === 'fb') {
          if (o === q.answer) cls = ' right';
          else if (SS.lastResult === 'no' && o === SS.picked) cls = ' wrong';
        }
        return '<button class="opt' + cls + '" data-act="vocab-answer" data-id="' + U.esc(o) + '">' + U.esc(o) + '</button>';
      }).join('') + '</div>' +
      (SS.phase === 'fb'
        ? '<div class="fb ' + SS.lastResult + '">' +
        '<div class="ex-box"><div class="ex">' + U.esc(q.word.ex) + ui.speakBtn(q.word.ex) + '</div><div class="ex-cn">' + U.esc(q.word.exCn) + '</div></div>' +
        '<div class="row3">' + ui.btn('下一个', 'vocab-next', { cls: 'primary' }) + ui.btn('加入错词本', 'vocab-markWrong', { id: q.word.id }) + ui.btn('结束', 'vocab-exit', {}) + '</div>' +
        '</div>'
        : '') +
      '</div>';
  }

  function renderHub(el) {
    var deckId = S.state.settings.deck;
    var st = vocab.stats(deckId);
    var due = srs.dueWords(deckId === 'all' ? null : deckId).length;
    var newCount = vocab.all(deckId).filter(function (w) { return !S.state.words[w.id]; }).length;

    el.innerHTML =
      ui.card(
        '<div class="row spread"><b>词库</b>' + ui.muted('共 ' + st.total + ' 词') + '</div>' +
        ui.chips(vocab.decks, 'vocab-deck', deckId) +
        '<div class="row mini spread"><span>已学 ' + st.seen + '</span><span>已掌握 ' + st.mastered + '</span><span>未学 ' + newCount + '</span></div>' +
        ui.bar(st.seen / Math.max(1, st.total) * 100)
      ) +
      ui.card(
        '<div class="row spread"><b>今日任务</b></div>' +
        '<div class="task-grid">' +
        '<div class="task"><span class="t-ico">🆕</span><b>学新词</b><i>' + Math.min(15, newCount) + ' 词</i>' + ui.btn('开始', 'vocab-start', { val: 'learn', cls: 'primary sm' }) + '</div>' +
        '<div class="task"><span class="t-ico">🔁</span><b>到期复习</b><i>' + due + ' 词</i>' + ui.btn('开始', 'vocab-start', { val: 'review', cls: 'primary sm' }) + '</div>' +
        '</div>'
      ) +
      ui.card('<b>练习模式</b>' +
        '<div class="mode-grid">' + MODES.map(function (m) {
          return '<div class="mode-item"><div><b>' + m.label + '</b><p class="muted">' + m.desc + '</p></div>' +
            ui.btn('Go', 'vocab-start', { val: m.id, cls: 'sm' }) + '</div>';
        }).join('') + '</div>') +
      ui.card('<div class="row spread"><b>我的词库</b>' +
        '<div class="row"><input id="vSearch" class="input sm" placeholder="搜索单词或中文…">' +
        ui.btn('错词本(' + S.state.wrongbook.filter(function (x) { return x.kind === 'word'; }).length + ')', 'vocab-startWrong', { cls: 'sm' }) + '</div></div>' +
        '<div id="vocabList" class="word-list"></div>');

    var inp = document.getElementById('vSearch');
    if (inp) inp.oninput = function () { ui.fire('vocab-search', inp); };
    ui.fire('vocab-search', document.getElementById('vSearch'));
  }

  App.views = App.views || {};
  App.views.vocab = {
    title: '单词',
    icon: '📖',
    render: function (el) {
      if (SS.mode && SS.items.length) renderSession(el); else renderHub(el);
    }
  };
  App.vocabSession = SS;

  /* ---------- 事件 ---------- */
  function renderList(q) {
    var box = document.getElementById('vocabList');
    if (!box) return;
    q = (q || '').trim().toLowerCase();
    var list = vocab.all(S.state.settings.deck);
    if (q) list = list.filter(function (w) { return w.word.toLowerCase().indexOf(q) >= 0 || w.cn.indexOf(q) >= 0; });
    list = list.slice(0, 200);
    box.innerHTML = list.map(function (w) {
      var p = S.state.words[w.id];
      var badge = !p ? '<span class="dot new"></span>' : (p.mastered ? '<span class="dot ok"></span>' : '<span class="dot ing"></span>');
      return '<div class="wl-item" data-act="vocab-detail" data-id="' + w.id + '">' + badge +
        '<div class="wl-w"><b>' + U.esc(w.word) + '</b><span class="muted">' + U.esc(w.phon) + '</span></div>' +
        '<div class="wl-cn">' + U.esc(w.cn) + '</div></div>';
    }).join('') || ui.muted('没有匹配的单词');
  }

  ui.on('vocab-search', function (a) { renderList(a.el.value); });
  ui.on('vocab-deck', function (a) { S.state.settings.deck = a.val; S.save(); App.views.vocab.render(document.getElementById('view')); });
  ui.on('vocab-start', function (a) { start(a.val); });
  ui.on('vocab-exit', function () { SS.mode = null; SS.items = []; App.views.vocab.render(document.getElementById('view')); });
  ui.on('vocab-startWrong', function () {
    var ids = U.shuffle(S.state.wrongbook.filter(function (x) { return x.kind === 'word'; }).map(function (x) { return x.id; })).slice(0, 20);
    if (!ids.length) return U.toast('错词本是空的');
    start('quiz', ids);
  });
  ui.on('vocab-reveal', function () { SS.revealed = true; App.views.vocab.render(document.getElementById('view')); });
  ui.on('vocab-grade', function (a) { gradeLearn(parseInt(a.val, 10)); });
  ui.on('vocab-next', function () { SS.i++; next(); });
  ui.on('vocab-answer', function (a) { SS.picked = a.el.getAttribute('data-id'); answerChoice(SS.picked); });
  ui.on('vocab-check', function () {
    var i = document.getElementById('spellInput');
    if (i) checkSpell(i.value);
  });
  ui.on('vocab-hint', function () { var i = document.getElementById('spellInput'); if (i && SS.q.word) i.value = SS.q.word.word.slice(0, 1); });
  ui.on('vocab-slow', function (a) { root.App.tts.speak(a.el.getAttribute('data-id'), { rate: 0.6 }); });
  ui.on('vocab-over', function (a) { manualGrade(parseInt(a.val, 10)); SS.i++; next(); });
  ui.on('vocab-markWrong', function (a) { srs.addWrong('word', a.id); U.toast('已加入错词本'); });
  ui.on('vocab-detail', function (a) {
    var w = vocab.byId(a.id); if (!w) return;
    var p = S.state.words[w.id];
    ui.modal(w.word + '  ' + w.phon,
      '<div class="mean big">' + U.esc(w.cn) + ' <span class="tag sm">' + U.esc(w.pos) + '</span></div>' +
      '<div class="ex-box"><div class="ex">' + U.esc(w.ex) + ui.speakBtn(w.ex) + '</div><div class="ex-cn">' + U.esc(w.exCn) + '</div></div>' +
      '<div class="row mini spread muted"><span>状态：' + (!p ? '未接触' : (p.mastered ? '已掌握' : '复习中 · 第 ' + p.reps + ' 次')) + '</span>' +
      '<span>下次复习：' + (p ? p.due : '—') + '</span></div>' +
      '<div class="row">' + ui.btn('朗读例句 🐢', 'speak', { id: w.ex }) + ui.btn('加入错词本', 'vocab-markWrong', { id: w.id }) + '</div>',
      ui.btn('关闭', 'close-modal', {}));
  });

  App.startVocab = start;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== js/views-grammar.js ===== */
/* ===========================================================
 * 语法模块：专题知识 → 随堂练 → 错题进入复习队列
 * =========================================================== */
(function (root) {
  'use strict';
  var App = root.App, U = App.util, S = App.store, ui = App.ui;

  var GS = { mode: 'list', topic: null, qi: 0, answers: [], phase: 'q', picked: null, input: '' };

  function qid(topicId, idx) { return topicId + ':' + idx; }

  function renderList(el) {
    var topics = root.App.GRAMMAR;
    var wrongCount = S.state.wrongbook.filter(function (x) { return x.kind === 'grammar'; }).length;
    el.innerHTML =
      ui.card('<div class="row spread"><b>语法专题</b>' + ui.muted(topics.length + ' 讲 · 共 ' + topics.reduce(function (a, t) { return a + t.quiz.length; }, 0) + ' 题') + '</div>' +
        '<p class="muted">针对雅思写作 GRA 与口语句法设计：每讲含 5 道随堂练习，错题自动排队复习。</p>') +
      (wrongCount ? ui.card('<div class="row spread"><div><b>语法错题</b><br><span class="muted">' + wrongCount + ' 题待巩固</span></div>' +
        ui.btn('立刻重做', 'grammar-practiceWrong', { cls: 'primary' }) + '</div>') : '') +
      '<div class="topic-grid">' + topics.map(function (t, i) {
        var done = t.quiz.filter(function (q, j) { return (S.state.grammar[qid(t.id, j)] || {}).ok; }).length;
        return '<div class="topic-card" data-act="grammar-open" data-id="' + t.id + '">' +
          '<div class="row spread"><span class="tag sm">' + U.esc(t.level) + '</span><span class="muted">' + done + '/' + t.quiz.length + '</span></div>' +
          '<b>' + U.esc(t.title) + '</b>' +
          '<p class="muted">' + U.esc(t.brief.slice(0, 46)) + '…</p>' +
          ui.bar(done / t.quiz.length * 100) +
          '</div>';
      }).join('') + '</div>';
  }

  function renderTopic(el) {
    var t = GS.topic;
    el.innerHTML =
      '<div class="row spread"><button class="btn sm ghost" data-act="grammar-back">← 返回列表</button>' +
      '<span class="tag">' + U.esc(t.level) + '</span></div>' +
      ui.card('<h3 class="h">' + U.esc(t.title) + '</h3><p class="lead">' + U.esc(t.brief) + '</p>' +
        '<div class="points">' + t.points.map(function (p) {
          return '<div class="point"><b>' + U.esc(p.t) + '</b><span>' + U.esc(p.d) + '</span></div>';
        }).join('') + '</div>') +
      ui.card('<div class="row spread"><b>随堂练习</b>' + ui.muted(t.quiz.length + ' 题') + '</div>' +
        '<p class="muted">提交后立即显示解析，错题自动进入复习队列。</p>' +
        ui.btn('开始练习 ' + t.quiz.length + ' 题', 'grammar-start', { cls: 'primary block' }));
  }

  function renderQuiz(el) {
    var t = GS.topic, q = t.quiz[GS.qi];
    if (!q) { renderSummary(el); return; }
    var total = t.quiz.length;
    el.innerHTML =
      '<div class="row spread"><button class="btn sm ghost" data-act="grammar-back">← 退出</button><span class="muted">' + (GS.qi + 1) + ' / ' + total + '</span></div>' +
      ui.bar(GS.qi / total * 100) +
      ui.card(
        '<div class="prompt">' + U.esc(q.q) + '</div>' +
        (q.type === 'choice'
          ? '<div class="opts">' + q.options.map(function (o) {
            var cls = '';
            if (GS.phase === 'fb') {
              var ans = q.options[q.a];
              if (o === ans) cls = ' right'; else if (o === GS.picked) cls = ' wrong';
            }
            return '<button class="opt' + cls + '" data-act="grammar-answer" data-id="' + U.esc(o) + '">' + U.esc(o) + '</button>';
          }).join('') + '</div>'
          : '<div class="row"><input id="gInput" class="input" placeholder="填写答案后回车" value="' + U.esc(GS.input) + '">' +
          ui.btn('提交', 'grammar-fill', { cls: 'primary' }) + '</div>' +
          '<span class="muted mini">多个答案用 / 分隔也可接受</span>') +
        (GS.phase === 'fb'
          ? '<div class="fb ' + (GS.lastOk ? 'ok' : 'no') + '">' +
          '<div class="fb-head">' + (GS.lastOk ? '✅ 正确' : '❌ 正确答案：' + U.esc(q.type === 'choice' ? q.options[q.a] : String(q.a[0]))) + '</div>' +
          '<div class="reason">' + U.esc(q.ex) + '</div>' +
          (q.type === 'fill' ? '<div class="row center-row">' + ui.btn('就当我会（不算错）', 'grammar-credit', { cls: 'sm' }) + '</div>' : '') +
          '<div class="row center-row">' + ui.btn(GS.qi === total - 1 ? '查看结果 →' : '下一题 →', 'grammar-next', { cls: 'primary' }) + '</div>' +
          '</div>'
          : '')
      );
    if (q.type === 'fill') {
      var inp = document.getElementById('gInput');
      if (inp) { inp.focus(); inp.onkeydown = function (e) { if (e.key === 'Enter') ui.fire('grammar-fill', inp); }; }
    }
  }

  function renderSummary(el) {
    var ok = GS.answers.filter(Boolean).length, total = GS.answers.length;
    el.innerHTML = ui.card('<div class="center"><div class="done-ico">' + (ok === total ? '🎯' : '📘') + '</div>' +
      '<h3>' + U.esc(GS.topic.title) + ' · 完成</h3>' +
      '<div class="stat-row"><div><b>' + ok + '</b><span>正确</span></div><div><b>' + (total - ok) + '</b><span>错误</span></div><div><b>' + Math.round(ok / total * 100) + '%</b><span>正确率</span></div></div>' +
      '<div class="row center-row">' + ui.btn('再做一次', 'grammar-start', { cls: 'primary' }) + ui.btn('返回列表', 'grammar-back', {}) + '</div></div>');
  }

  App.views = App.views || {};
  App.views.grammar = {
    title: '语法', icon: '✍️',
    render: function (el) {
      if (GS.mode === 'topic') renderTopic(el);
      else if (GS.mode === 'quiz' || GS.mode === 'summary') renderQuiz(el);
      else renderList(el);
    }
  };

  function grade(okAnswer) {
    var t = GS.topic, q = t.quiz[GS.qi], id = qid(t.id, GS.qi);
    var st = S.state.grammar[id] || { ok: 0, wrong: 0, due: U.today() };
    if (okAnswer) {
      st.ok = 1; st.wrong = Math.max(0, (st.wrong || 0) - 1);
      if (st.wrong === 0) st.due = U.addDays(U.today(), 7);
      App.srs.clearWrong('grammar', id);
      S.bump('quiz');
    } else {
      st.wrong = (st.wrong || 0) + 1; st.ok = 0; st.due = U.today();
      App.srs.addWrong('grammar', id, U.esc(t.title) + '：' + U.esc(q.q).slice(0, 30));
      S.bump('review');
    }
    S.state.grammar[id] = st; S.save();
  }

  ui.on('grammar-open', function (a) {
    GS.topic = root.App.GRAMMAR.filter(function (t) { return t.id === a.id; })[0];
    GS.mode = 'topic'; App.views.grammar.render(document.getElementById('view'));
  });
  ui.on('grammar-back', function () { GS.mode = 'list'; GS.topic = null; App.views.grammar.render(document.getElementById('view')); });
  ui.on('grammar-start', function (a) {
    if (!GS.topic) return;
    GS.mode = 'quiz'; GS.qi = 0; GS.answers = []; GS.phase = 'q'; GS.input = '';
    App.views.grammar.render(document.getElementById('view'));
  });
  ui.on('grammar-answer', function (a) {
    if (GS.phase === 'fb') return;
    var t = GS.topic, q = t.quiz[GS.qi];
    GS.picked = a.el.getAttribute('data-id');
    GS.lastOk = GS.picked === q.options[q.a];
    GS.phase = 'fb';
    GS.answers[GS.qi] = GS.lastOk;
    grade(GS.lastOk);
    App.views.grammar.render(document.getElementById('view'));
  });
  ui.on('grammar-fill', function (a) {
    if (GS.phase === 'fb') return;
    var t = GS.topic, q = t.quiz[GS.qi];
    var val = String((a.el && a.el.value) || document.getElementById('gInput').value || '').trim().toLowerCase();
    GS.input = val;
    var expects = q.a.map(function (x) { return x.toLowerCase(); });
    GS.lastOk = expects.some(function (e) { return val === e || (e.indexOf(' ') > 0 && val.indexOf(e) >= 0); });
    GS.phase = 'fb'; GS.answers[GS.qi] = GS.lastOk;
    grade(GS.lastOk);
    App.views.grammar.render(document.getElementById('view'));
  });
  ui.on('grammar-credit', function () {
    GS.lastOk = true; GS.answers[GS.qi] = true; grade(true);
    App.views.grammar.render(document.getElementById('view'));
  });
  ui.on('grammar-next', function () {
    GS.qi++;
    if (GS.qi >= GS.topic.quiz.length) { GS.mode = 'summary'; App.views.grammar.render(document.getElementById('view')); return; }
    GS.phase = 'q'; GS.input = ''; GS.picked = null;
    App.views.grammar.render(document.getElementById('view'));
  });
  ui.on('grammar-practiceWrong', function () {
    var entries = S.state.wrongbook.filter(function (x) { return x.kind === 'grammar'; });
    if (!entries.length) return U.toast('没有语法错题');
    GS.mode = 'quiz';
    GS.topic = { id: 'review', title: '语法错题重做', quiz: [] };
    GS.topic.quiz = entries.map(function (e) {
      var parts = e.id.split(':');
      var t = root.App.GRAMMAR.filter(function (x) { return x.id === parts[0]; })[0];
      return t ? t.quiz[parseInt(parts[1], 10)] : null;
    }).filter(Boolean);
    if (!GS.topic.quiz.length) return U.toast('错题数据已失效');
    GS.qi = 0; GS.answers = []; GS.phase = 'q';
    App.views.grammar.render(document.getElementById('view'));
  });

  App.grammarSession = GS;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== js/views-speaking.js ===== */
/* ===========================================================
 * 口语模块：情景模拟 / 影子跟读 / 自由陈述 + AI 评分老师
 * =========================================================== */
(function (root) {
  'use strict';
  var App = root.App, U = App.util, S = App.store, ui = App.ui;
  var tts = App.tts, asr = App.asr;

  var CUES = [
    { t: 'Why should we hire you?', b: ['Your value proposition', 'Evidence, not adjectives', 'What you deliver in month one', 'Close with a question'] },
    { t: 'Describe a time you learned something quickly.', b: ['Situation / Task', 'What you had to learn', 'How you learned it', 'Result & what stuck'] },
    { t: 'Describe a difficult decision you made.', b: ['Context', 'Options you weighed', 'Why you chose it', 'What happened next'] },
    { t: 'Describe a career-related achievement.', b: ['The target', 'What you did differently', 'Quantified outcome', 'What you learned'] },
    { t: 'Describe a person who influenced your career.', b: ['Who they are', 'How you met', 'Their impact on you', 'What changed afterwards'] },
    { t: 'Describe a city you would like to work in.', b: ['Where & why', 'Job opportunities', 'Cost of living vs salary', 'What worries you'] },
    { t: 'Tell me about a project that failed.', b: ['What went wrong', 'Your part in it', 'How you responded', 'The lesson'] },
    { t: 'Describe a time you disagreed with someone.', b: ['Their position', 'Your argument', 'Evidence you used', 'Resolution'] },
    { t: 'Talk about a big change in your industry.', b: ['What changed', 'Why it happened', 'Who benefits', 'Your prediction'] },
    { t: 'Describe an app or tool you rely on.', b: ['What it does', 'How you use it', 'Pros and cons', 'Who it suits'] },
    { t: 'Where do you want to be in five years?', b: ['Skills you want', 'Type of role', 'Type of team', 'How you will get there'] },
    { t: 'Describe a place you have studied or worked in.', b: ['Description', 'Atmosphere', 'People', 'Why it suited (or not)'] }
  ];

  var SP = {
    tab: 'roleplay',
    role: null,        // {sc, idx, log:[], done:false}
    shadow: { mode: 'list', pid: null, idx: 0, res: null, whole: false },
    video: { mode: 'list', vid: null, idx: 0, res: null },
    free: { mode: 'list', cue: null, res: null },
    rec: { active: false, startedAt: 0, timer: null, maxMs: 60000, url: null, cb: null },
    textMode: !asr.supported()
  };

  /* ---------------- 录音控制 ---------------- */
  function updateRecUI() {
    var st = document.getElementById('recStatus');
    if (!st) return;
    var sec = Math.round((Date.now() - SP.rec.startedAt) / 1000);
    st.textContent = '● 录音中 ' + sec + 's  （最长 ' + Math.round(SP.rec.maxMs / 1000) + 's）';
  }

  function startRec(maxSec, cb) {
    if (SP.rec.active) return;
    SP.rec.active = true; SP.rec.startedAt = Date.now(); SP.rec.url = null;
    SP.rec.maxMs = (maxSec || 60) * 1000; SP.rec.cb = cb;
    updateRecUI();
    SP.rec.timer = setInterval(function () {
      updateRecUI();
      if (Date.now() - SP.rec.startedAt >= SP.rec.maxMs) stopRec();
    }, 250);
    if (!SP.textMode) {
      App.recorder.start().catch(function () { });
      asr.start({
        lang: 'en-US',
        onPartial: function (full) {
          var p = document.getElementById('recPartial');
          if (p) p.textContent = full || '（还没识别到内容…）';
        },
        onError: function (err) {
          if (err === 'not-allowed') { SP.textMode = true; U.toast('麦克风未授权，已切换打字模式'); }
        }
      });
    }
    App.views.speaking.render(document.getElementById('view'));
  }

  function stopRec() {
    if (!SP.rec.active) return;
    SP.rec.active = false;
    clearInterval(SP.rec.timer);
    var cb = SP.rec.cb; SP.rec.cb = null;
    var dur = Date.now() - SP.rec.startedAt;
    var wrap = function (text, segs) {
      App.recorder.stop().then(function (url) { if (url) SP.rec.url = url; });
      App.views.speaking.render(document.getElementById('view'));
      if (cb) cb(text, { durationMs: dur, segments: segs || [] });
    };
    if (!SP.textMode) {
      asr.stop();
      setTimeout(function () { wrap(SP.rec._final || '', SP.rec._segs || []); }, 400);
    } else {
      var ta = document.getElementById('textAnswer');
      wrap(ta ? ta.value.trim() : '', []);
    }
  }

  // 包裹 asr.start 收集最终结果
  (function wrapAsr() {
    var origStart = asr.start;
    asr.start = function (opt) {
      var o2 = {}, k;
      for (k in (opt || {})) o2[k] = opt[k];
      var prevEnd = o2.onEnd;
      o2.onEnd = function (finalText, segs, dur) {
        SP.rec._final = finalText || '';
        SP.rec._segs = segs || [];
        if (prevEnd) prevEnd(finalText, segs, dur);
      };
      SP.rec._final = ''; SP.rec._segs = [];
      return origStart(o2);
    };
  })();

  /* ---------------- 评分与报告 ---------------- */
  function saveSession(type, title, res) {
    S.state.sessions.push({
      date: U.today(), type: type, title: title,
      overall: res.scores.overall, scores: res.scores,
      words: res.metrics.words, errors: res.errors.length
    });
    if (S.state.sessions.length > 120) S.state.sessions.shift();
    S.bump('speak');
    S.save();
  }

  function reportHtml(res, opt) {
    opt = opt || {};
    var sc = res.scores;
    var dims = [
      { k: '流利度 Fluency', v: sc.fluency, d: res.metrics.wpm + ' wpm · 填充词 ' + res.metrics.fillerCount },
      { k: '词汇 Lexical', v: sc.vocabulary, d: res.lexis.uniq + ' 个不同词 · TTR ' + res.lexis.ttr.toFixed(2) },
      { k: '语法 Grammar', v: sc.grammar, d: res.errors.length + ' 处疑似问题 · 从句 ' + res.metrics.subordinates },
      { k: '发音 Pronunciation', v: sc.pronunciation, d: res.pronunciation ? '匹配度 ' + Math.round(res.pronunciation.accuracy * 100) + '%' : '未提供参考文本' }
    ];
    return '<div class="report">' +
      '<div class="report-head">' +
      '<div class="band"><b>' + (sc.overall % 1 ? sc.overall.toFixed(1) : sc.overall) + '</b><span>Overall Band</span></div>' +
      '<div class="band-dims">' + dims.map(function (d) {
        var val = d.v == null ? '—' : (d.v % 1 ? d.v.toFixed(1) : d.v);
        return '<div class="dim"><div class="row spread"><span>' + d.k + '</span><b>' + val + '</b></div>' +
          ui.bar((d.v || 0) / 9 * 100) + '<span class="muted mini">' + d.d + '</span></div>';
      }).join('') + '</div>' +
      '</div>' +
      (res.text ? '<div class="transcript"><b>你的回答：</b><p>' + U.esc(res.text) + '</p>' +
        (SP.rec.url ? '<audio controls src="' + SP.rec.url + '"></audio>' : '') + '</div>' : '') +
      (res.errors.length ? '<div class="corr"><b>AI 老师纠错（' + res.errors.length + '）</b>' +
        res.errors.slice(0, 8).map(function (c) {
          return '<div class="corr-item ' + c.type + '">' +
            '<div class="row"><span class="badge ' + c.type + '">' + (c.type === 'grammar' ? '语法' : '词汇') + '</span>' +
            '<code class="no">“' + U.esc(c.original) + '”</code> → <code class="yes">' + U.esc(c.suggestion) + '</code></div>' +
            '<p class="muted">' + U.esc(c.reason) + '</p></div>';
        }).join('') + '</div>' : '<div class="corr ok-box">✅ 本次未检测到明显语法/搭配错误。</div>') +
      (res.lexis.suggestions.length ? '<div class="corr"><b>词汇升级建议</b>' +
        res.lexis.suggestions.slice(0, 6).map(function (c) {
          return '<div class="corr-item lexis"><div class="row"><code class="no">“' + U.esc(c.original) + '”</code> → <code class="yes">' + U.esc(c.suggestion) + '</code></div></div>';
        }).join('') + '</div>' : '') +
      (res.pronunciation && (res.pronunciation.missed.length || res.pronunciation.substituted.length)
        ? '<div class="corr"><b>发音待修正</b>' +
        (res.pronunciation.missed.length ? '<p class="muted">漏读/未识别：' + res.pronunciation.missed.map(function (w) { return '<code class="no">' + U.esc(w) + '</code>'; }).join(' ') + '</p>' : '') +
        (res.pronunciation.substituted.length ? '<p class="muted">发音偏差：' + res.pronunciation.substituted.map(function (s) { return '<code class="no">' + U.esc(s.ref) + '</code> 听成了 ' + '<code class="no">' + U.esc(s.got) + '</code>'; }).join('、') + '</p>' : '') +
        '</div>' : '') +
      '<div class="tips"><b>下一步建议</b><ul>' + res.tips.map(function (t) { return '<li>' + U.esc(t) + '</li>'; }).join('') + '</ul></div>' +
      (opt.deepBtn !== false ? '<div class="row center-row">' +
        (S.state.settings.llm.enabled && S.state.settings.llm.apiKey
          ? ui.btn('✨ 让 GPT 再点评一遍', 'sp-deep', { cls: 'primary' })
          : '<span class="muted mini">在「设置」中填写 API Key，可解锁大模型逐句精批</span>') +
        '</div>' : '') +
      '<div id="deepBox"></div>' +
      '</div>';
  }

  /* ---------------- 情景模拟 ---------------- */
  function renderRole(el) {
    if (!SP.role) {
      el.innerHTML =
        ui.card('<b>情景模拟</b><p class="muted">扮演求职者，与 AI 面试官全流程对话。每个回答都会被打分（流利度 / 词汇 / 语法 / 发音），结束后出整体评估与逐条纠错。</p>') +
        '<div class="sc-grid">' + root.App.SCENARIOS.map(function (s) {
          return '<div class="sc-card" data-act="sp-roleOpen" data-id="' + s.id + '">' +
            '<div class="sc-ico">' + s.icon + '</div>' +
            '<div class="sc-body"><b>' + U.esc(s.title) + '</b>' +
            '<span class="tag sm">' + U.esc(s.level) + '</span>' +
            '<p class="muted">' + U.esc(s.desc) + '</p></div></div>';
        }).join('') + '</div>' +
        (SP.textMode ? ui.card('<b>提示</b><p class="muted">当前浏览器不支持语音识别（建议用 Chrome / Edge / Safari），已切换为<b>打字模式</b>：直接在文本框里用英文作答，评分逻辑完全一致。</p>') : '');
      return;
    }

    var r = SP.role, sc = r.sc;
    var node = sc.nodes[r.idx];
    var html = '<div class="row spread"><button class="btn sm ghost" data-act="sp-roleExit">← 退出</button>' +
      '<span class="tag">' + U.esc(sc.title) + ' · ' + (r.idx + 1) + '/' + sc.nodes.length + '</span></div>' +
      ui.bar(r.idx / sc.nodes.length * 100) +
      '<div class="chat" id="chat">' + r.log.map(function (m) {
        if (m.who === 'ai') {
          return '<div class="bub ai"><div class="bub-txt">' + U.esc(m.text) + '</div>' +
            '<div class="bub-act"><button class="spk" data-act="speak" data-id="' + U.esc(m.text) + '" data-accent="' + sc.accent + '">🔊 重听</button></div></div>';
        }
        return '<div class="bub me"><div class="bub-txt">' + U.esc(m.text) + '</div>' +
          '<div class="bub-act"><span class="mini-score">' + (m.score ? '本次 ' + m.score.toFixed(1) : '') + '</span></div></div>';
      }).join('') + '</div>';

    if (r.done) {
      html += r.reportHtml;
      html += '<div class="row center-row">' + ui.btn('重来一次', 'sp-roleRestart', { cls: 'primary' }) +
        ui.btn('换个场景', 'sp-roleExit', {}) + '</div>';
    } else if (SP.rec.active) {
      html += '<div class="card rec-box">' +
        '<div class="q-tip"><b>' + U.esc(node.q) + '</b></div>' +
        '<div id="recStatus" class="rec-status">● 录音中…</div>' +
        '<div id="recPartial" class="rec-partial muted"></div>' +
        ui.btn('■ 停止并评分', 'sp-stop', { cls: 'danger block' }) + '</div>';
    } else {
      html += '<div class="card">' +
        '<div class="q-tip"><b>面试官：</b>' + U.esc(node.q) +
        '<span class="spk" data-act="speak" data-id="' + U.esc(node.q) + '" data-accent="' + sc.accent + '">🔊</span></div>' +
        '<details class="tipbox"><summary>💡 回答提示</summary><p class="muted">' + U.esc(node.tip) + '</p></details>' +

          ? '<textarea id="textAnswer" class="input area" placeholder="Type your answer in English…"></textarea>' +

          : '<div class="row center-row">' + ui.btn('🎤 开始回答（点击后再说）', 'sp-start', { cls: 'primary mic-lg', val: '90' }) +
          ui.btn('跳过这题', 'sp-skip', {}) + '</div>' +
          '<p class="muted mini center">点击后开始录音，最长 90 秒，说完点「停止并评分」。</p>') +

    var c = document.getElementById('chat');
    if (c) setTimeout(function () { c.scrollTop = c.scrollHeight; }, 20);
  }

  function roleAnswer(text, meta) {
    var r = SP.role, sc = r.sc, node = sc.nodes[r.idx];
    if (!text || text.length < 2) {
      U.toast('没听清内容，再说一遍试试');
      App.views.speaking.render(document.getElementById('view'));
      return;
    }
    var res = App.eval.analyze({ text: text, durationMs: meta.durationMs, segments: meta.segments });
    r.log.push({ who: 'me', text: text, score: res.scores.overall });
    r.results = r.results || [];
    r.results.push(res);
    r.comments = r.comments || [];

    // 即时点评：挑最严重的一条
    var top = res.errors[0] || res.lexis.suggestions[0];
    if (top) {
      r.log.push({
        who: 'ai',
        text: 'Got it. Quick note though — you said “' + top.original + '”, which we’d more naturally say “' + top.suggestion + '”. Keep going.'
      });
      speakLast(sc.accent);
    } else if (probe(node, text)) {
      r.log.push({ who: 'ai', text: probe(node, text) });
      speakLast(sc.accent);
    } else {
      r.log.push({ who: 'ai', text: node.ack || 'Thanks.' });
      speakLast(sc.accent);
    }

    App.views.speaking.render(document.getElementById('view'));

    // 最后一题 → 生成报告；否则切到下一题（问题只在卡片区显示，不重复进对话流）
    if (r.idx >= sc.nodes.length - 1) {
      setTimeout(function () { finishRole(); }, 400);
    } else {
      setTimeout(function () {
        r.idx++;
        App.views.speaking.render(document.getElementById('view'));
        if (S.state.settings.autoSpeak) tts.speak(sc.nodes[r.idx].q, { accent: sc.accent });
      }, 1100);
    }
  }

  function speakLast(accent) {
    if (!S.state.settings.autoSpeak) return;
    var last = SP.role.log[SP.role.log.length - 1];
    if (last && last.who === 'ai') tts.speak(last.text, { accent: accent });
  }

  function probe(node, text) {
    var low = ' ' + text.toLowerCase() + ' ';
    for (var i = 0; i < (node.probes || []).length; i++) {
      var p = node.probes[i];
      for (var j = 0; j < p.m.length; j++) {
        if (low.indexOf(p.m[j].toLowerCase()) >= 0) return p.say;
      }
    }
    return null;
  }

  function finishRole() {
    var r = SP.role, sc = r.sc, list = r.results || [];
    if (!list.length) return;
    var texts = list.map(function (x) { return x.text; }).join(' ');
    var agg = App.eval.analyze({ text: texts, durationMs: list.reduce(function (a, x) { return a + (x.metrics.minutes * 60000); }, 0) });
    agg.errors = [].concat.apply([], list.map(function (x) { return x.errors; }));
    var avg = function (k) {
      return U.toHalf(list.reduce(function (a, x) { return a + (x.scores[k] || 0); }, 0) / list.length);
    };
    agg.scores = {
      fluency: avg('fluency'), vocabulary: avg('vocabulary'), grammar: avg('grammar'),
      pronunciation: list[0].hasPronunciation ? null : null,
      overall: U.toHalf(list.reduce(function (a, x) { return a + x.scores.overall; }, 0) / list.length)
    };
    SP.role.reportHtml = reportHtml(agg);
    SP.role.done = true;
    saveSession('role', sc.title, agg);
    // 最弱的一句话进复习队列
    var worst = list.slice().sort(function (a, b) { return a.scores.overall - b.scores.overall; })[0];
    if (worst && worst.scores.overall < 6.5) {
      App.srs.addWrong('speak', sc.id + ':' + SP.role.log.length, worst.text.slice(0, 80));
    }
    tts.speak(sc.outro, { accent: sc.accent });
    SP.role.log.push({ who: 'ai', text: sc.outro });
    App.views.speaking.render(document.getElementById('view'));
  }

  function shadowResult(text, meta) {

      saveSession('shadow', p.title + ' · 全文', res);
